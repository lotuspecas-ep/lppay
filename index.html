<style>
:root{--bg:#FAFAFC;--sur:#FFF;--ink:#191B1D;--dim:#6B7076;--line:#E3E6EA;--soft:#F1F3F6;
 --acc:#C41E6B;--jade:#0E8174;--blue:#2C6EF2;--amber:#D08A0E;--violet:#6D4AE0;--red:#C82B36;--green:#1E8A4C;

.btn:focus-visible,[contenteditable]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.panel{display:none;padding-top:24px;animation:f .25s}.panel.on{display:block}

.lead{color:var(--dim);max-width:66ch;margin:6px 0 18px}
.mod{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}

.mvb{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--sur);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--dim)}

.g{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.kv:last-child{border:0}.kv b{font-weight:600;text-align:right}

.ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sur);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.87rem}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top;text-align:left}

tr.sect th{background:linear-gradient(90deg,color-mix(in srgb,var(--violet) 12%,var(--sur)),var(--sur));font-weight:700;font-size:.78rem;letter-spacing:.04em;color:var(--violet);text-transform:uppercase}
td[contenteditable]:hover{background:color-mix(in srgb,var(--blue) 5%,transparent)}

tr.dov th,tr.dov td{box-shadow:inset 0 3px 0 var(--acc)}
tr.sel th,tr.sel td,th.sel{background:color-mix(in srgb,var(--acc) 10%,var(--sur))!important}
.pick{cursor:pointer;padding:0 7px;color:var(--dim);border-radius:6px}
.pick:hover{background:var(--soft);color:var(--ink)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%}
.clt{width:100%;min-width:330px;border:0}
.clt th{background:none;position:static;font-size:.72rem;color:var(--dim);padding:3px 5px;min-width:0}
.clt td{padding:4px 5px;border:0}
.clt input{padding:5px 6px;font-size:.82rem;text-align:center;min-width:52px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.todo{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border:0}.todo.done .t{text-decoration:line-through;color:var(--dim)}
.meta{font-size:.76rem;color:var(--dim)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0));z-index:35}
.fab button{width:48px;height:48px;border-radius:24px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;cursor:pointer}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.85rem;z-index:60;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
dialog{border:0;border-radius:var(--r);padding:18px;max-width:420px;width:92%;background:var(--sur);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
#gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.hidden{display:none!important}
.segs{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.segs button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:.83rem;color:var(--dim)}
.segs button.on{background:var(--sur);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09);font-weight:500}
.ctr{display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap}
.fbar{display:flex;height:40px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.fbar div{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#fff;transition:flex-basis .45s;font-weight:500}
.lg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.8rem;color:var(--dim)}
.i{display:inline-block;width:14px;height:14px;line-height:12px;border-radius:50%;
 border:1px solid var(--line);color:var(--dim);font-size:9px;font-weight:600;font-style:normal;cursor:help;
 margin:0 0 0 5px;vertical-align:1px;text-align:center;background:var(--sur);position:relative;top:-1px}
.i:hover{border-color:var(--blue);color:var(--blue);background:var(--sur)}
label{display:block}
label>.i{float:right;margin:2px 0 0 6px;top:0}
.kv .i,h3 .i{float:none}
.tx{display:inline-block;margin-left:6px;font-size:9px;font-weight:700;letter-spacing:.04em;
 padding:1px 5px;border-radius:5px;border:1px dashed var(--amber);color:var(--amber);cursor:pointer;
 vertical-align:1px;background:color-mix(in srgb,var(--amber) 8%,transparent);user-select:none}
.tx:hover{background:var(--amber);color:#fff;border-style:solid}
#tipbox{position:fixed;z-index:200;background:var(--ink);color:var(--bg);padding:10px 13px;border-radius:10px;
 font-size:12.5px;line-height:1.45;max-width:290px;letter-spacing:-.005em;pointer-events:none;
 opacity:0;transition:opacity .13s;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:400}
#tipbox.on{opacity:1}
.calc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--soft);
 border-radius:10px;padding:12px 14px;margin-top:10px;overflow-x:auto;line-height:1.75}
.calc .op{color:var(--dim)}
.calc .res{font-weight:600}
.calc hr{border:0;border-top:1px dashed var(--line);margin:7px 0}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
body.cmt [data-anchor]{cursor:crosshair}
body.cmt [data-anchor]:hover{outline:2px dashed var(--acc);outline-offset:2px}
.cbadge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:.68rem;font-weight:600;padding:0 5px}
.hl{animation:hl 2s}@keyframes hl{0%,60%{background:color-mix(in srgb,var(--acc) 15%,transparent)}}
.ci{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sur)}
.ci.done{opacity:.55;border-left-color:var(--green)}
.reply{border-left:2px solid var(--line);padding:3px 0 3px 10px;margin:6px 0 0 4px;font-size:.85rem}
.dot{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.chipb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sur);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;color:var(--dim);opacity:.55}
.chipb.on{opacity:1;color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--sur))}
.acq{display:flex;align-items:center;gap:7px}
@media(max-width:600px){h1{font-size:1.35rem}.modb{padding:13px}.wrap{padding:0 12px 130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>

<div id="gate"><div style="max-width:320px;width:100%;text-align:center">
 <div id="gl" style="margin-bottom:16px"></div><h2>Lp.Pay</h2>

 <button class="btn xs" id="cmtbtn"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg><span id="cmtlabel">Commenta</span></button>
 <button class="btn xs" id="themebtn" title="Chiaro / scuro"><svg class="ico" viewBox="0 0 24 24" id="thi"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.2v2.2M12 19.6v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.2 12h2.2M19.6 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></button>

<script>
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
const NV='<span class="badge warn">non verificato</span>';
let L=localStorage.getItem('lp_lang')||'it';
const t=(i,e)=>L==='it'?i:e;
const $=s=>document.querySelector(s);

let S;const LS='lppay_v9';
const tip=(x)=>`<i class="i" tabindex="0" data-tip="${esc(x)}">i</i>`;
const GEN={
 mdr:'Merchant Discount Rate: the percentage the merchant pays on takings. On €100 at 1.49% the merchant receives 98.51.',
 inter:'Interchange: the slice the acquirer passes to the bank that issued the card. Capped in the EU: 0.20% consumer debit, 0.30% consumer credit.',
 scheme:'Scheme fee: what the card network (Visa, Mastercard, PagoBANCOMAT) keeps to move the transaction.',
 margin:'Acquirer margin: what is left to the acquirer after interchange and scheme fee. Our share comes out of this.',
 share:'The percentage of that margin the acquirer passes to us. With Dojo it is 20% of Monthly Net Profit.',
 bundle:'Cluster model: each client pays a fixed annual fee set by its transaction band. Busier merchants sit in a higher band.',
 flat:'Flat bonus: they pay us once, when the POS is activated. After that the client generates nothing.',
 pctm:'Margin share: we earn a percentage of what the acquirer earns on volume. It grows with volume, not with installations.',
 custom:'Composable model: fixed annual per client, amount per transaction and margin share add up. Zero out what you do not use.',
 inst:'What they pay us for each POS we install. One-off: it does not come back next year.',
 lic:'What Lotus Pecas invoices the client for the software every year. Unrelated to the acquirer.',
 maint:'Annual support fee on our own software.',
 clients:'How many merchants have one of our POS live and working during the year.',
 tx:'How many card payments an average client takes in a year. A busy bar is around 8,000, a niche shop under 1,000.',
 ticket:'What a single payment is worth on average. A bar around €8, a restaurant €45.',
 newc:'How many new installations we do in the year. It only drives the one-off bonuses.',
 disc:'The discount we grant a large client to keep them. It reduces what we collect on that client.',
 big:'What share of the client base counts as large and therefore gets that discount.',
 rec:'Recurring: it comes every year while the client stays. This is the number that matters after year one.',
 one:'One-off: tied to this year\'s new installations. If we stop installing, it disappears.',
 liq:'Licences and maintenance on our own software: our revenue, independent of which acquirer we pick.',
 vol:'Volume: the total in euro passing through our POS estate in a year.',
 una:'What the client pays once at activation (installation or purchase of the device).',
 can:'What the client pays every month to keep the terminal.',
 revd:'What we earn for each installation of that terminal.',
 sett:'Settlement: when the money actually lands on the merchant account, usually the next day. Different from authorisation, which is instant.',
 auth:'Authorisation: the bank\'s yes or no, in a few hundred milliseconds. No money has moved yet.'};
const G=new Proxy({},{get:(_,k)=>(L==='en'?GEN[k]:GIT[k])||GIT[k]||''});
/* ================= SEED ================= */
const SEED={pw:'LP2026',logo:null,
layout:{overview:['stato','roadmap','rischi'],revenue:['par','chart','models'],devices:['filter','chart','list','multi'],flow:['anim','split'],decisions:['list']},
overview:[
 {id:uid(),k:'Nexi',v:'Due contratti firmati. Collaborazione commerciale 21/11/2025: 120 € per SmartPOS, 90 € per Mini, 20 € per SoftPOS, più management fee annuale a cluster ma solo per 3 anni per cliente. App Approval Policy 10/09/2026: l\'app Lp.Pay è sullo store, gratuita, senza revenue share.',s:'ok'},
 {id:uid(),k:'Dojo / Paymentsense',v:'Referral integrato firmato 25/05/2026: 20% del Monthly Net Profit, 4% via rivenditori. Nessuna % di listino italiana pubblica.',s:'ok'},
 {id:uid(),k:'Fabrick / Banca Sella',v:'80 € per POS attivato, zero revenue sul transato. Set contrattuale ISV in finalizzazione secondo scambio email.',s:'warn'},
 {id:uid(),k:'Adyen',v:'Nessun contatto avviato. Interchange++ con 0,11 € per transazione e markup dallo 0,60%, ma con una probabile fattura minima mensile intorno ai 1.000 € e un posizionamento enterprise. Dati da fonti di mercato, tutti da confermare con loro.',s:''},
 {id:uid(),k:'La domanda da risolvere',v:'Premio secco (Sella) paga subito e smette. Quota sul margine (Dojo) paga poco all\'inizio e cresce col parco. Nexi sta in mezzo. Dipende da quanti POS installiamo nei primi 18 mesi.',s:''},
 {id:uid(),k:'Cosa manca per decidere',v:'MDR medio italiano di Dojo, conferma scritta sul white label Nexi, soglia di passaggio da bundle a % fee, contratto Fabrick.',s:'stop'}],
risks:[
 {id:uid(),t:'La management fee Nexi dura solo 3 anni per cliente',x:'Allegato A: la fee annuale è riconosciuta per un massimo di 3 anni solari dall\'attivazione. Un cliente installato nel 2026 smette di pagarci nel 2029, anche se resta attivo. Il modello ricorrente ha una scadenza incorporata che nessuno ha ancora messo a piano.',l:'alto'},
 {id:uid(),t:'Senza voucher inserito, Nexi non ci riconosce nulla',x:'Allegato A §3.1: il mancato o errato inserimento del voucher da parte del cliente impedisce a Nexi di rendicontare, in nessun caso. Tutta la nostra marginalità Nexi dipende da un codice che deve digitare l\'esercente.',l:'alto'},
 {id:uid(),t:'Non possiamo vendere il POS, solo segnalarlo',x:'Art. 5.2: è vietato promuovere o collocare servizi di pagamento, attività riservata ex D.Lgs. 385/1993. Possiamo solo informare dell\'esistenza del voucher. La forza commerciale va istruita su questo confine o esponiamo il gruppo.',l:'alto'},
 {id:uid(),t:'Sullo store Nexi non incassiamo nulla',x:'App Approval Policy, Annex: l\'app Lp.Pay è gratuita per l\'esercente, 0 €/mese, nessun in-app purchase. Le licenze le fatturiamo sulla nostra piattaforma. Lo store è un canale di distribuzione, non di ricavo.',l:'medio'},
 {id:uid(),t:'Dojo può ridurre la nostra quota da solo',x:'Art. 2.1: revisione unilaterale della Compensation Share con 30 giorni di preavviso, e se la modifica non è "materiale" a loro giudizio non abbiamo diritto di recesso.',l:'alto'},
 {id:uid(),t:'Dojo può risolvere se cambia il nostro assetto',x:'Art. 3.3.1: variazione di proprietà o management di Lotus Pecas = risoluzione immediata. Art. 3.3.3: zero nuovi merchant in un trimestre, stesso esito.',l:'alto'},
 {id:uid(),t:'Con Sella non vediamo il nostro parco',x:'Nessun profilo super user: il transato dei nostri clienti è accessibile solo via API. Problema di controllo commerciale, non tecnico.',l:'medio'},
 {id:uid(),t:'Il modello Sella non ha coda',x:'80 € per POS e nulla di ricorrente: a installazioni ferme il ricavo va a zero, mentre Nexi e Dojo continuano.',l:'medio'},
 {id:uid(),t:'White label Nexi non confermato',x:'La pubblicazione dell\'app sullo store è certa, il branding completo dell\'esperienza POS no. Da mettere per iscritto prima di comunicarlo alla rete.',l:'medio'}],

 cellsEn:{"nexi|r1": "Acquirer and issuer, Nexi group", "nexi|r2": "Italy", "nexi|r3": "Bank of Italy — e-money register art. 114-quater, no. 32875.7", "nexi|r4": "Leading domestic operator", "nexi|r5": "Two separate contracts. <b>Commercial Collaboration Agreement</b> signed 21/11/2025, 3 years with tacit annual renewal, either party may withdraw on 60 days notice. <b>App Approval Policy</b> signed 10/09/2026, effective 01/01/2027 for 12 months, auto-renewing, 90 days notice.", "nexi|r6": "Commercial Collaboration Agreement signed 21/11/2025, Schedule A. One-off activation: SmartPOS €120, SmartPOS Mini with printer €90, SoftPOS €20, all net of VAT. Annual management fee by transaction cluster per device: XS 20 · S 60 · M 120 · L 240 · XL 450. Paid in one instalment by 15 February of the following year, <b>for a maximum of 3 calendar years from activation</b>. Only POS with at least one transaction in the period count. The OnSet licence at €395/year and maintenance at €95 or €195 are our own price list, not Nexi.", "nexi|r7": "Moving from the bundle to a % fee on volume is a board hypothesis: <b>it appears in none of the signed contracts</b>. Threshold and percentage entirely to be negotiated. Mind the 3 calendar year cap on the management fee: in year four a client activated today is worth nothing. <span class=\"badge warn\">not verified</span>", "nexi|r8": "No discount is contemplated in Schedule A: amounts are fixed per cluster. A reduction would have to be negotiated as a written amendment under art. 11.1. <span class=\"badge warn\">not verified</span>", "nexi|r9": "Commercial collaboration: 3 years from 21/11/2025, tacit annual renewal, either party may withdraw on 60 days notice. App Approval Policy: 12 months from 01/01/2027, 90 days notice. On termination Nexi pays only what has accrued, nothing for later periods.", "nexi|r10": "The Lp.Pay app is free to the merchant, €0/month, no in-app purchase: Nexi takes nothing on our subscriptions and we earn nothing through the store. Fees are collected on the Lotus Pecas Platform, outside the SmartPOS. The app must not compete with Nexi or pre-installed apps, ad banners and monetisation of the second display are forbidden, referral traffic is forbidden. Support in Italian or English during working hours is mandatory: poor SLA is grounds for removal.", "nexi|f1": "SmartPOS dual screen, SmartPOS Mini with printer, Bluetooth Mobile POS, SoftPOS", "nexi|f2": "Yes — €10 one-off, no monthly fee. PagoBANCOMAT on Android only, JCB/UPI excluded", "nexi|f3": "Android SmartPOS with its own app store", "nexi|f4": "LP landing page list, 22/09/2026 — Italia+: Visa/MC consumer 0.89% (+0.65% non-EEA), commercial 1.69%, PagoBANCOMAT 0.69%, JCB/UPI 2.49%, Amex 0% up to €3,000. Welcome Special flat 1.49%. CNP +0.95%. Under €30: −0.05%.", "nexi|f5": "SmartPOS €12/month + €49 installation · Mini €10/month + €49 · SoftPOS and Mobile POS no monthly fee · Protection Plus PCI €2.50 + €7.50 one-off", "nexi|f6": "Monthly fee bundled with a Nexi acquiring contract", "nexi|f7": "Reseller programme + ISV publication on the SmartPOS store", "nexi|f8": "<b>Answer found in the documents: no.</b> App Approval Policy §10: Developers MUST refer to the device as \"Nexi SmartPOS\". The Lp.Pay app carries our brand on the store, but the terminal stays Nexi. No white label of the device.", "nexi|f9": "Android SmartPOS SDK + catalogue API + content provider. Every apk goes through the Developer Portal and Nexi review, updates included. Downloading extra code after certification is forbidden, so is root access and any licence screen at launch. Demos and betas cannot be distributed on the store. Test devices on loan signed 03/12/2025, 11 months.", "nexi|f10": "The acquiring contract is signed directly between Nexi and the merchant: <b>we may not promote or place payment services</b> (art. 5.2, reserved activity under Legislative Decree 385/1993). Our only instrument is the <b>voucher</b>: if the client does not enter it, Nexi owes us nothing (Schedule A §3.1). Reporting is half-yearly. If the merchant withdraws from acquiring, our fees stop immediately. Court of Milan. Loaned material must be returned, penalty up to €500 per terminal.", "nexi|f11": "Next business day, with an Italian bank account", "nexi|f12": "24/7 phone support from Italy, 7 days a week", "nexi|g1": "Yes", "nexi|g2": "Yes, monthly fee", "nexi|g3": "Yes", "nexi|g4": "Yes (XPay, outside the landing page)", "nexi|g5": "Yes, Pay-by-Link included, €0.30 per link transaction", "nexi|g6": "not verified", "dojo|r1": "Acquirer, a Paymentsense brand", "dojo|r2": "Ireland — Paymentsense Ireland Ltd, reg. 542166", "dojo|r3": "Central Bank of Ireland <span class=\"badge warn\">not verified</span>", "dojo|r4": "Italian country manager, over 150 staff claimed", "dojo|r5": "Integrated Referral Partner Agreement, 25/05/2026, 3 years", "dojo|r6": "20% of Monthly Net Profit on merchants we refer, 4% on those referred by our resellers. Never both on the same merchant.", "dojo|r7": "Paymentsense may unilaterally revise the share and the costs on 30 days notice (art. 2.1).", "dojo|r8": "No surcharge tied to choosing Dojo (art. 1.7.7) and merchant pricing is approved by Paymentsense (art. 1.10).", "dojo|r9": "3 years from 25/05/2026. Paymentsense may terminate on 90 days, or immediately if ownership or management changes or if no new merchant is added in a quarter. 12-month payment tail.", "dojo|r10": "Not applicable: no store, direct integration subject to QA.", "dojo|f1": "Dojo Go portable, fixed countertop POS, pocket <span class=\"badge warn\">not verified</span>", "dojo|f2": "not verified", "dojo|f3": "not verified", "dojo|f4": "No Italian rate card published. No percentage from an official source. <span class=\"badge warn\">not verified</span>", "dojo|f5": "not verified", "dojo|f6": "not verified", "dojo|f7": "Referral, reseller and ISV / software house channels", "dojo|f8": "Excluded: sublicensing or modifying Paymentsense software is forbidden (art. 1.8)", "dojo|f9": "APIs for ISV and ECR integration, over 50 Italian till systems integrated. Integration is only valid after QA and written confirmation (art. 1.7.4).", "dojo|f10": "Irish law and courts. No exclusivity (art. 1.5). Termination on 90 days, or immediate if no new merchants in a quarter or if our ownership or management changes (art. 3.3). 12-month payment tail. 18-month non-solicitation. Liability capped at €10,000.", "dojo|f11": "Next day (Dojo source)", "dojo|f12": "Support in Italian 7 days a week, 99.99% uptime claimed", "dojo|g1": "Yes", "dojo|g2": "not verified", "dojo|g3": "not verified", "dojo|g4": "Yes <span class=\"badge warn\">not verified</span>", "dojo|g5": "not verified", "dojo|g6": "not verified", "sella|r1": "Fabrick as technology enabler, acquiring by Banca Sella, Axerve terminals", "sella|r2": "Italy", "sella|r3": "Bank of Italy", "sella|r4": "Yes, Italian banking group", "sella|r5": "ISV partner programme, contract set being finalised (email 2026). <span class=\"badge warn\">not verified</span>", "sella|r6": "€80 per activated POS. No revenue share on volume.", "sella|r7": "Model open to review over the years as the partnership grows, stated by email and not contractual. <span class=\"badge warn\">not verified</span>", "sella|r8": "Standard terms for clients: no stated room to move on merchant pricing.", "sella|r9": "Contract set not yet received. <span class=\"badge warn\">not verified</span>", "sella|r10": "Not applicable. <span class=\"badge warn\">not verified</span>", "sella|f1": "Axerve range, rental or purchase", "sella|f2": "not verified", "sella|f3": "not verified", "sella|f4": "Not disclosed: Banca Sella acquiring on standard terms. <span class=\"badge warn\">not verified</span>", "sella|f5": "not verified", "sella|f6": "Yes, rental or purchase (Axerve)", "sella|f7": "Yes. An ISV with no eCommerce component is admitted, confirmed by email.", "sella|f8": "not verified", "sella|f9": "Standard channel 17 for till connection, or an API key for remote connection to the terminals", "sella|f10": "No minimum volume. KYC, underwriting and ownership of the merchant relationship sit with Banca Sella; technology and logistics support with Fabrick.", "sella|f11": "not verified", "sella|f12": "First line and logistics with Fabrick, acquiring and disputes with Banca Sella. A dashboard for the merchant; no super user profile, volume visible to us only via API.", "sella|g1": "Yes", "sella|g2": "Yes", "sella|g3": "not verified", "sella|g4": "Yes (Axerve, outside our scope)", "sella|g5": "not verified", "sella|g6": "not verified", "adyen|r1": "Acquirer, processor and issuer on a single platform", "adyen|r2": "Netherlands — Adyen N.V., Dutch banking licence", "adyen|r3": "De Nederlandsche Bank. Italian branch in Milan. <span class=\"badge warn\">To confirm</span>", "adyen|r4": "Yes, Milan office. Stated focus on enterprise and platforms", "adyen|r5": "No contact started. Partner programme open to POS integrators and software houses through the partner form.", "adyen|r6": "The partner programme mentions financial rewards, referral and marketing support. No public percentage: market models for ISVs range from a share of the acquirer markup to a plain one-off referral. <span class=\"badge warn\">To confirm</span>", "adyen|r7": "Benefits grow as the partnership consolidates. The acquirer markup falls as monthly volume rises: that is the improvement lever over time, not a change of model. <span class=\"badge warn\">To confirm</span>", "adyen|r8": "Interchange++ shows the merchant every component: a discount can only be negotiated on the Adyen markup, not on interchange and scheme fees which are pass-through costs. <span class=\"badge warn\">To confirm</span>", "adyen|r9": "not verified", "adyen|r10": "A partner marketplace exists but terms are not public. <span class=\"badge warn\">To confirm</span>", "adyen|f1": "Own range of PCI PTS 6 certified terminals for retail, hospitality, events, delivery", "adyen|f2": "Tap to Pay on iPhone and Android live in several European markets. Italian availability <span class=\"badge warn\">To confirm</span>", "adyen|f3": "Own range built on Castles and similar hardware, PCI PTS 6 certified. <span class=\"badge warn\">To confirm</span>", "adyen|f4": "Interchange++ as stated by Adyen: interchange + scheme fee + acquirer markup. <b>€0.11 flat per transaction in Europe</b> plus a markup starting at 0.60% on volume, falling as monthly volume grows (source: help.adyen.com and 2026 market analyses). Average total cost on European consumer cards around 1%. Chargebacks around €25 per dispute. <span class=\"badge warn\">To confirm</span>", "adyen|f5": "No stated monthly or setup fee, but several 2026 market analyses report a <b>minimum monthly invoice around €1,000</b>: below that threshold you pay the difference anyway. For a small estate that is the real hidden cost. <span class=\"badge warn\">To confirm</span>", "adyen|f6": "Terminals for purchase or rental from the Adyen list, prices not public for Italy. <span class=\"badge warn\">To confirm</span>", "adyen|f7": "Partner programme with a dedicated portal, partner manager, quality badge and early access to pilots. Explicit channel for POS and system integrators.", "adyen|f8": "Adyen for Platforms lets us manage sub-merchants under our own platform, the closest thing to white label for our needs. It does mean collecting SAQ A and taking on onboarding responsibility. <span class=\"badge warn\">To confirm</span>", "adyen|f9": "Terminal API in JSON, local or cloud, no middleware. Terminals managed centrally with automatic updates. Full public documentation.", "adyen|f10": "No self-service sign-up: there is a sales process that market analyses put at several weeks. Historically aimed at mid-market and enterprise, with volume thresholds now relaxed but not gone. The real question for us is whether we meet their criteria. <span class=\"badge warn\">To confirm</span>", "adyen|f11": "Payout frequency and currency are configurable, typically daily or weekly depending on risk profile. Italian timings <span class=\"badge warn\">To confirm</span>", "adyen|f12": "Enterprise support with a dedicated partner manager and partner portal. Contractual SLA and Italian-language coverage <span class=\"badge warn\">To confirm</span>", "adyen|g1": "Yes", "adyen|g2": "Terminal rental available, terms not public. <span class=\"badge warn\">To confirm</span>", "adyen|g3": "Tap to Pay in several EU markets. <span class=\"badge warn\">To confirm</span>", "adyen|g4": "Yes", "adyen|g5": "Yes (pay by link) <span class=\"badge warn\">To confirm</span>", "adyen|g6": "QR and local wallets supported by the platform. <span class=\"badge warn\">To confirm</span>"},

 'nexi|r1':'Acquirer e issuer, gruppo Nexi','nexi|r2':'Italia','nexi|r3':'Banca d\'Italia — Albo IMEL art. 114-quater, n. 32875.7','nexi|r4':'Operatore domestico principale',
 'nexi|r5':'Due contratti distinti. <b>Accordo di Collaborazione Commerciale</b> firmato 21/11/2025, 3 anni con rinnovo tacito annuale, recesso di una delle parti con 60 giorni di preavviso. <b>App Approval Policy</b> firmata 10/09/2026, efficace dal 01/01/2027 per 12 mesi, rinnovo automatico, disdetta con 90 giorni.','nexi|r6':'Accordo di Collaborazione Commerciale firmato 21/11/2025, Allegato A. Una tantum attivazione: SmartPOS 120 €, SmartPOS Mini con stampante 90 €, SoftPOS 20 €, tutti netti IVA. Management fee annuale per cluster di transazioni per dispositivo: XS 20 · S 60 · M 120 · L 240 · XL 450 €. Pagata in un\'unica soluzione entro il 15.02 dell\'anno successivo, <b>per un massimo di 3 anni solari dall\'attivazione</b>. Contano solo i POS con almeno una transazione nel periodo. Licenza OnSet 395 €/anno/cliente e manutenzione 95 o 195 € sono nostro listino, non Nexi.',
 'nexi|r7':'Il passaggio da bundle a % fee sul transato è un\'ipotesi della direzione: <b>non compare in nessuno dei contratti firmati</b>. Soglia e percentuale tutte da negoziare. Attenzione al limite dei 3 anni solari sulla management fee: al quarto anno un cliente attivato oggi vale zero. '+NV,'nexi|r8':'Nessuno sconto previsto dall\'Allegato A: i corrispettivi sono fissi per cluster. Un ribasso andrebbe negoziato come modifica scritta ex art. 11.1. '+NV,
 'nexi|r9':'Collaborazione commerciale: 3 anni dal 21/11/2025, rinnovo tacito annuale, recesso libero con 60 giorni da entrambe le parti. App Approval Policy: 12 mesi dal 01/01/2027, disdetta con 90 giorni. Alla cessazione Nexi paga solo i corrispettivi maturati, nulla per i periodi successivi.',
 'nexi|r10':'L\'app Lp.Pay è gratuita per l\'esercente, 0 €/mese, nessun in-app purchase: Nexi non prende nulla sulle nostre sottoscrizioni e noi non incassiamo nulla dallo store. Le fee le incassiamo sulla Lotus Pecas Platform, fuori dal SmartPOS. L\'app non deve competere con Nexi o con app preinstallate, vietati banner pubblicitari e monetizzazione del secondo schermo, vietato guidare traffico referral. Assistenza in italiano o inglese in orario lavorativo, obbligatoria: un SLA scadente è motivo di rimozione.',
 'dojo|r9':'3 anni dal 25/05/2026. Paymentsense può risolvere con 90 giorni, o subito se cambia proprietà/management o se in un trimestre non portiamo nuovi merchant. Coda compensi 12 mesi.',
 'dojo|r10':'Non applicabile: nessuno store, integrazione diretta previa QA.',

 'nexi|f4':'Listino landing LP, 22/09/2026 — Italia+: Visa/MC consumer 0,89% (+0,65% extra EEA), commercial 1,69%, PagoBANCOMAT 0,69%, JCB/UPI 2,49%, Amex 0% fino a 3.000 €. Welcome Special 1,49% unica. CNP +0,95%. Sotto 30 €: −0,05%.',
 'nexi|f5':'SmartPOS 12 €/mese + 49 € installazione · Mini 10 €/mese + 49 € · SoftPOS e Mobile POS canone zero · Protection Plus PCI 2,50 € + 7,50 € una tantum',
 'nexi|f6':'Canone mensile con contratto acquiring Nexi','nexi|f7':'Rivenditori + pubblicazione ISV su store SmartPOS',
 'nexi|f8':'<b>Risposta trovata nei documenti: no.</b> App Approval Policy §10: i Developer DEVONO riferirsi al dispositivo come "Nexi SmartPOS". L\'app Lp.Pay è pubblicata col nostro marchio sullo store, ma il terminale resta Nexi. Nessun white label del device.',
 'nexi|f9':'SDK Android SmartPOS + catalogue API + content provider. Ogni apk passa dal Developer Portal e dalla review Nexi, anche gli aggiornamenti. Vietato scaricare codice aggiuntivo dopo la certificazione, vietato root, vietata licenza o chiave all\'avvio. Demo e beta non distribuibili sullo store. Conto visione test firmato 03/12/2025, 11 mesi.',
 'nexi|f10':'Il contratto acquiring si firma direttamente tra Nexi e l\'esercente: <b>noi non possiamo promuovere né collocare servizi di pagamento</b> (art. 5.2, attività riservata ex D.Lgs. 385/1993). Il nostro unico strumento è il <b>voucher</b>: se il cliente non lo inserisce, Nexi non ci riconosce nulla (Allegato A §3.1). Rendicontazione semestrale. Se l\'esercente recede dall\'acquiring, i nostri compensi si fermano subito. Foro di Milano. Materiale in conto visione da restituire, penale fino a 500 €/terminale.',

 'dojo|f10':'Legge e foro irlandesi. Nessuna esclusiva (art. 1.5). Risoluzione con 90 gg, immediata se zero nuovi merchant in un trimestre o se cambia proprietà/management (art. 3.3). Coda compensi 12 mesi. Non-sollecitazione 18 mesi. Responsabilità max 10.000 €.',

 task:id=>{const p=$('#rdsel').value;S.roadmap[p]=S.roadmap[p].filter(x=>x.id!==id);save(1);roadmap()},
 dec:id=>{S.decisions=S.decisions.filter(d=>d.id!==id);save(1);decisions()},
 cmt:id=>{S.comments=S.comments.filter(c=>c.id!==id);save(1);comments();cbadges()},
 col:a=>{const[k,c]=a.split('|');S[k].cols=S[k].cols.filter(x=>x.id!==c);
   Object.keys(S[k].cells).forEach(x=>x.startsWith(c+'|')&&delete S[k].cells[x]);

 row:a=>{const[k,r]=a.split('|'),R=S[k].rows,i=R.findIndex(x=>x.id===r);if(i<0)return;

   <span class="pick" data-selr="${r.id}">●</span>${s?`<button class="btn xs dg" data-act="row:compare|${r.id}" style="margin-left:6px">Elimina</button>`:''}</th>`+
   D.cols.map(c=>`<td contenteditable data-cell="${c.id}|${r.id}" data-anchor="${esc(c.name)} · ${esc(r.label)}" style="color:color-mix(in srgb,${c.color||'var(--ink)'} 42%,var(--ink));box-shadow:inset 3px 0 0 color-mix(in srgb,${c.color||'var(--line)'} 22%,transparent)">${cellVal(c.id+'|'+r.id)}</td>${''}`).join('')

 el.innerHTML=h+'</tbody>';

 el.querySelectorAll('[data-cell]').forEach(x=>x.addEventListener('input',()=>{const cl=x.cloneNode(true);
  cl.querySelectorAll('.bar,.tx').forEach(n=>n.remove());CM_()[x.dataset.cell]=cl.innerHTML.trim();qs()}));
 el.querySelectorAll('[data-row]').forEach(x=>x.addEventListener('input',()=>{const r=D.rows.find(y=>y.id===x.dataset.row);
  if(r){if(EN())r.labelEn=x.textContent;else r.label=x.textContent}qs()}));
 el.querySelectorAll('[data-col]').forEach(x=>x.addEventListener('input',()=>{const c=D.cols.find(y=>y.id===x.dataset.col);
  if(c){if(EN())c.nameEn=x.textContent;else{c.name=x.textContent;const a=S.acq.find(y=>y.id===c.id);if(a)a.name=c.name}}qs()}));

function gridDrag(el){
 const R=()=>S.compare.rows;let src=null;
 el.querySelectorAll('tr[draggable]').forEach(tr=>{
  tr.addEventListener('dragstart',e=>{src=tr;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','x')});
  tr.addEventListener('dragover',e=>{e.preventDefault();
   const ok=src&&(src.dataset.sect?tr.dataset.sect==='1':true);tr.classList.toggle('dov',!!ok)});
  tr.addEventListener('dragleave',()=>tr.classList.remove('dov'));
  tr.addEventListener('drop',e=>{e.preventDefault();tr.classList.remove('dov');if(!src||src===tr)return;
   const rows=R(),a=rows.findIndex(x=>x.id===src.dataset.rid);
   if(src.dataset.sect){
    /* un blocco si muove solo davanti a un altro blocco */
    if(tr.dataset.sect!=='1'){toast(t('Una macrocategoria si sposta solo su un\'altra macrocategoria','Sections drop onto sections only'));return}
    const len=blockLen(rows,a),cut=rows.splice(a,len);
    const tgt=rows.findIndex(x=>x.id===tr.dataset.rid);
    rows.splice(tgt<0?rows.length:tgt,0,...cut);
   }else{
    if(tr.dataset.sect==='1'){toast(t('Rilascia la riga su un\'altra riga, non sull\'intestazione','Drop rows onto rows'));return}
    const[m]=rows.splice(a,1);rows.splice(rows.findIndex(x=>x.id===tr.dataset.rid),0,m)}
   save(1);grid()})});
 el.querySelectorAll('[data-dcol]').forEach(hd=>{const th=hd.closest('th');
  hd.addEventListener('dragstart',e=>e.dataTransfer.setData('col',hd.dataset.dcol));
  th.addEventListener('dragover',e=>e.preventDefault());
  th.addEventListener('drop',e=>{e.preventDefault();const s=e.dataTransfer.getData('col');if(!s)return;
   const C=S.compare.cols,a=C.findIndex(x=>x.id===s),b=C.findIndex(x=>x.id===hd.dataset.dcol);
   if(a<0||b<0||a===b)return;C.splice(b,0,C.splice(a,1)[0]);save(1);grid()})});
}

/* ================= simulatore ================= */
const eur=n=>new Intl.NumberFormat(L==='it'?'it-IT':'en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
function calc(a,p){const vol=p.c*p.tx*p.tk,big=p.b/100,eff=1-p.d/100;let rec=0;
 if(a.model==='bundle'){const cl=a.clusters.find(x=>p.tx>=x.min&&p.tx<=x.max);
  const fee=cl?cl.fee:(a.clusters.length?[...a.clusters].sort((x,y)=>y.min-x.min)[0].fee:0);rec=p.c*fee*((1-big)+big*eff)}
 if(a.model==='pct')rec=vol*Math.max(0,a.mdr-a.cost)/100*a.share/100*((1-big)+big*eff);
 if(a.model==='custom')rec=(p.c*(a.recfix||0)+p.c*p.tx*(a.pertx||0)+vol*Math.max(0,a.mdr-a.cost)/100*(a.share||0)/100)*((1-big)+big*eff);
 const one=p.n*a.inst,lic=p.c*(a.lic+a.maint);return{rec,one,lic,tot:rec+one+lic}}

  .map(p=>`<div style="flex:0 0 ${p[0]}%;background:${p[1]}">${p[0]>4?p[0].toFixed(2):''}</div>`).join('')}

/* ================= impostazioni ================= */
function settings(){
 $('#p-settings').innerHTML=`<h1>${t('Impostazioni','Settings')}</h1>
 <div class="g g2"><div class="card"><h3>Supabase</h3>
  <p class="sm dim">${t('Tabella lppay_state con id text primary key e data jsonb. Serve solo per condividere tra dispositivi: le modifiche restano comunque salvate in questo browser.','Only needed to share across devices: changes are saved in this browser anyway.')}</p>
  <label class="sm dim">Project URL<input id="sb_url" value="${esc(SB.url)}" placeholder="https://xxx.supabase.co"></label>
  <label class="sm dim" style="display:block;margin-top:8px">Anon key<input id="sb_key" type="password" value="${esc(SB.key)}"></label>
  <div class="row" style="margin-top:10px"><button class="btn p xs" id="sbs">${t('Collega','Connect')}</button>
   <button class="btn xs" id="sbp">${t('Scarica','Pull')}</button><button class="btn xs" id="sbu">${t('Carica','Push')}</button>
   <span class="badge ${sbOn()?'ok':''}">${sbOn()?'supabase':'locale'}</span></div></div>
 <div class="card"><h3>${t('Accesso e brand','Access and brand')}</h3>
  <label class="sm dim">${t('Nuova password','New password')}<input id="npw" placeholder="LP2026"></label>
  <button class="btn xs" id="spw" style="margin-top:8px">${t('Aggiorna','Update')}</button>
  <p class="sm dim">${t('Protezione client-side: tiene fuori i curiosi, non un attaccante. Per condizioni sotto NDA serve Supabase Auth con RLS.','Client-side only.')}</p>
  <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
  <div class="row"><label class="btn xs" style="cursor:pointer">Logo<input type="file" id="lf" accept="image/*" class="hidden"></label>
   <button class="btn xs" id="exp">${t('Esporta','Export')}</button>
   <label class="btn xs" style="cursor:pointer">${t('Importa','Import')}<input type="file" id="imf" accept="application/json" class="hidden"></label>
   <button class="btn xs dg" data-act="reset:x">${t('Reset dati iniziali','Reset seed')}</button></div></div></div>
 <div class="card" style="margin-top:14px"><h3>${t('Fonti e date di rilevazione','Sources and capture dates')}</h3>
  ${SRC.map(s=>`<div class="kv"><span><b style="font-weight:600">${esc(s[0])}</b><br><span class="sm dim">${esc(s[2])}</span></span><b>${s[1]}</b></div>`).join('')}</div>`;
 $('#sbs').onclick=()=>{SB.url=$('#sb_url').value.trim();SB.key=$('#sb_key').value.trim();
  localStorage.setItem('sb_url',SB.url);localStorage.setItem('sb_key',SB.key);settings();toast(sbOn()?'Collegato':'Campi vuoti')};
 $('#sbp').onclick=pull;$('#sbu').onclick=()=>{push();toast(t('Inviato','Pushed'))};
 $('#spw').onclick=()=>{const v=$('#npw').value.trim();if(v){S.pw=v;save()}};
 $('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;save(1);logo()};r.readAsDataURL(f)};
 $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='LpPay_'+new Date().toISOString().slice(0,10)+'.json';a.click()};
 $('#imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);load();save(1);all();toast(t('Importato','Imported'))}catch(x){toast('JSON non valido')}};r.readAsText(f)}}
DEL.reset=()=>{S=JSON.parse(JSON.stringify(SEED));save(1);all();toast(t('Dati ripristinati','Reset done'))};

/* ================= boot ================= */
const MARK=`<svg width="24" height="24" viewBox="0 0 40 40"><path d="M20 4c4 6 4 12 0 18-4-6-4-12 0-18z" fill="#C41E6B"/><path d="M6 20c6-3 12-1 14 6-7 2-12-1-14-6z" fill="#0E8174"/><path d="M34 20c-6-3-12-1-14 6 7 2 12-1 14-6z" fill="#0E8174" opacity=".7"/></svg>`;
function logo(){$('#logo').innerHTML=S.logo?`<img src="${S.logo}">`:MARK;
 $('#gl').innerHTML=S.logo?`<img src="${S.logo}" style="height:46px">`:MARK.replace(/"24"/g,'"46"')}
function all(){logo();nav();ovw();compare();revenue();devices();roadmap();decisions();comments();flowPanel();settings();cbadges()}
$('#fabset').onclick=()=>go('settings');
$('#themebtn').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark',n=dark?'light':'dark';
 document.documentElement.setAttribute('data-theme',n);localStorage.setItem('lp_theme',n);
 $('#thi').innerHTML=n==='dark'?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>':'<circle cx="12" cy="12" r="4.4"/><path d="M12 2.2v2.2M12 19.6v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.2 12h2.2M19.6 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>'};
$('#lang').onclick=()=>{L=L==='it'?'en':'it';localStorage.setItem('lp_lang',L);document.documentElement.lang=L;
 $('#lang').textContent=L==='it'?'EN':'IT';$('#cmtlabel').textContent=t('Commenta','Comment');all()};
function unlock(){if($('#pw').value===(S.pw||'LP2026')){$('#gate').style.display='none';sessionStorage.setItem('lp_ok','1')}else $('#pwe').classList.remove('hidden')}
$('#pwgo').onclick=unlock;$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&unlock());
let TDT=null;
document.addEventListener('click',e=>{const b=e.target.closest('.tx');if(!b)return;
 e.preventDefault();e.stopPropagation();
 const[kind,...rest]=b.dataset.tx.split('|'),key=rest.join('|');
 const other=EN()?'it':'en';
 let src='',cur='';
 if(kind==='cell'){src=(EN()?S.compare.cells[key]:S.compare.cells[key])||'';cur=EN()?S.compare.cells[key]:S.compare.cellsEn[key]||''}
 if(kind==='row'){const r=S.compare.rows.find(x=>x.id===key);src=EN()?r.labelEn:r.label;cur=EN()?r.label:r.labelEn||''}
 if(kind==='col'){const c=S.compare.cols.find(x=>x.id===key);src=EN()?c.nameEn:c.name;cur=EN()?c.name:c.nameEn||''}
 TDT={kind,key,target:other};
 $('#tdt').textContent=other==='en'?'Testo in inglese':'Testo in italiano';
 $('#tds').innerHTML=`<b>${t('Versione attuale','Current version')} (${EN()?'EN':'IT'}):</b><br>${esc(String(src).replace(/<[^>]+>/g,'')).slice(0,300)}`;
 $('#tdx').value=String(cur).replace(/<[^>]+>/g,'');
 $('#tdlg').showModal();$('#tdx').focus()},true);
document.addEventListener('DOMContentLoaded',()=>{});
const TB=$('#tipbox');
function showTip(el){const x=el.dataset.tip;if(!x)return;TB.textContent=x;TB.classList.add('on');
 const r=el.getBoundingClientRect(),b=TB.getBoundingClientRect();
 let left=r.left+r.width/2-b.width/2;
 left=Math.max(10,Math.min(left,innerWidth-b.width-10));
 let top=r.top-b.height-9;
 if(top<8)top=r.bottom+9;
 TB.style.left=left+'px';TB.style.top=top+'px'}
const hideTip=()=>TB.classList.remove('on');
document.addEventListener('mouseover',e=>{const i=e.target.closest('.i');if(i)showTip(i)});
document.addEventListener('mouseout',e=>{if(e.target.closest('.i'))hideTip()});
document.addEventListener('focusin',e=>{const i=e.target.closest('.i');if(i)showTip(i)});
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);
document.addEventListener('click',e=>{const i=e.target.closest('.i');if(i){e.stopPropagation();showTip(i);setTimeout(hideTip,4500)}},true);
$('#tdc').onclick=()=>$('#tdlg').close();
$('#tdo').onclick=()=>{if(!TDT)return;const v=$('#tdx').value.trim();const{kind,key,target}=TDT;
 if(kind==='cell'){if(target==='en')S.compare.cellsEn[key]=v;else S.compare.cells[key]=v}
 if(kind==='row'){const r=S.compare.rows.find(x=>x.id===key);if(target==='en')r.labelEn=v;else r.label=v}
 if(kind==='col'){const c=S.compare.cols.find(x=>x.id===key);if(target==='en')c.nameEn=v;else{c.name=v;const a=S.acq.find(y=>y.id===key);if(a)a.name=v}}
 $('#tdlg').close();save(1);compare();toast(t('Traduzione salvata','Translation saved'))};
load();
const th=localStorage.getItem('lp_theme')||'light';document.documentElement.setAttribute('data-theme',th);
if(th==='dark')$('#thi').innerHTML='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
$('#lang').textContent=L==='it'?'EN':'IT';
all();if(sessionStorage.getItem('lp_ok'))$('#gate').style.display='none';if(sbOn())pull();
</script></body></html>

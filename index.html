 <div class="card" style="margin-top:14px"><h3>${t('Fonti e date di rilevazione','Kaynaklar ve veri tarihleri')}</h3>
  ${SRC.map(x=>`<div class="kv"><span><b style="font-weight:600">${esc(x[0])}</b><br><span class="sm dim">${esc(x[2])}</span></span><b>${x[1]}</b></div>`).join('')}</div>`;
 const P=$('#p-settings'),g=id=>P.querySelector('#'+id);
 if(g('sbs'))g('sbs').onclick=()=>{SB.url=g('sb_url').value.trim();SB.key=g('sb_key').value.trim();
  localStorage.setItem('sb_url',SB.url);localStorage.setItem('sb_key',SB.key);
  SYNC={state:sbOn()?'ro':'off',msg:''};SYNC={state:sbOn()?(TOK?'rw':'ro'):'off',msg:''};syncBadge();if(sbOn())pull(1);else all()};
 if(g('sbin'))g('sbin').onclick=()=>sbLogin(g('sb_em').value.trim(),g('sb_pw').value);
 if(g('sb_pw'))g('sb_pw').addEventListener('keydown',e=>{if(e.key==='Enter')sbLogin(g('sb_em').value.trim(),g('sb_pw').value)});
 if(g('sbp'))g('sbp').onclick=()=>pull();
 if(g('sbu'))g('sbu').onclick=()=>{push();toast(t('Inviato','Gönderildi'))};
 if(g('sbout'))g('sbout').onclick=sbLogout;
 if(g('cpsql'))g('cpsql').onclick=()=>{navigator.clipboard?.writeText(sql);toast(t('SQL copiato','SQL kopyalandı'))};
 g('spw').onclick=()=>{const v=g('npw').value.trim();if(v){S.pw=v;save()}};
 g('lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;save(1);logo()};r.readAsDataURL(f)};
 g('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='LP-Pay-Italia_'+new Date().toISOString().slice(0,10)+'.json';a.click()};
 g('imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);load();save(1);all();toast(t('Importato','İçe aktarıldı'))}catch(x){toast('JSON non valido')}};r.readAsText(f)}}
DEL.reset=()=>{S=JSON.parse(JSON.stringify(SEED));save(1);all();toast(t('Dati ripristinati','Veriler sıfırlandı'))};

/* ================= boot ================= */
const MARK=`<svg width="24" height="24" viewBox="0 0 40 40"><path d="M20 4c4 6 4 12 0 18-4-6-4-12 0-18z" fill="#C41E6B"/><path d="M6 20c6-3 12-1 14 6-7 2-12-1-14-6z" fill="#0E8174"/><path d="M34 20c-6-3-12-1-14 6 7 2 12-1 14-6z" fill="#0E8174" opacity=".7"/></svg>`;
function logo(){$('#logo').innerHTML=S.logo?`<img src="${S.logo}">`:MARK;
 $('#gl').innerHTML=S.logo?`<img src="${S.logo}">`:MARK.replace(/"24"/g,'"72"')}
function all(){logo();nav();ovw();compare();revenue();circ();devices();plan();comments();flowPanel();settings();cbadges();syncBadge();
 if(!canEdit())document.querySelectorAll('[contenteditable]').forEach(e=>e.setAttribute('contenteditable','false'))}
$('#fabset').onclick=()=>go('settings');
$('#themebtn').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark',n=dark?'light':'dark';
 document.documentElement.setAttribute('data-theme',n);localStorage.setItem('lp_theme',n);
 $('#thi').innerHTML=n==='dark'?'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>':'<circle cx="12" cy="12" r="4.4"/><path d="M12 2.2v2.2M12 19.6v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.2 12h2.2M19.6 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>'};
function unlock(){if($('#pw').value===(S.pw||'LP2026')){$('#gate').style.display='none';sessionStorage.setItem('lp_ok','1')}else $('#pwe').classList.remove('hidden')}
function setLang(n){if(n===L)return;L=n;localStorage.setItem('lp_lang',L);
 document.documentElement.lang=(L==='en'?'tr':'it');
 const cl=$('#cmtlabel');if(cl)cl.textContent=t('Commenta','Yorum yap');
 langUI();all()}
function langUI(){
 document.querySelectorAll('#langsw button').forEach(b=>b.classList.toggle('on',b.dataset.lg===L));
 document.querySelectorAll('[data-i2]').forEach(e=>{const[a,b]=e.dataset.i2.split('|');e.textContent=L==='it'?a:b});
 document.querySelectorAll('[data-ph2]').forEach(e=>{const[a,b]=e.dataset.ph2.split('|');e.placeholder=L==='it'?a:b});
 gateLangUI()}
document.querySelectorAll('#langsw button').forEach(b=>b.onclick=()=>setLang(b.dataset.lg));
document.querySelectorAll('#gatelang button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('#gatelang button').forEach(x=>x.classList.toggle('on',x===b));
 setLang(b.dataset.gl)});
function gateLangUI(){document.querySelectorAll('#gatelang button').forEach(b=>b.classList.toggle('on',b.dataset.gl===L))}
$('#pwgo').onclick=unlock;$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&unlock());
let TDT=null;
document.addEventListener('click',e=>{const b=e.target.closest('.tx');if(!b)return;
 e.preventDefault();e.stopPropagation();
 const[kind,...rest]=b.dataset.tx.split('|'),key=rest.join('|');
 const other=EN()?'it':'en';
 let src='',cur='';
 if(kind==='cell'){src=(EN()?S.compare.cells[key]:S.compare.cells[key])||'';cur=EN()?S.compare.cells[key]:S.compare.cellsEn[key]||''}
 if(kind==='row'){const r=S.compare.rows.find(x=>x.id===key);src=EN()?r.labelEn:r.label;cur=EN()?r.label:r.labelEn||''}
 if(kind==='col'){const c=S.compare.cols.find(x=>x.id===key);src=EN()?c.nameEn:c.name;cur=EN()?c.name:c.nameEn||''}
 TDT={kind,key,target:other};
 $('#tdt').textContent=other==='en'?'Metin Türkçe':t('Testo in italiano','Metin İtalyanca');
 $('#tds').innerHTML=`<b>${t('Versione attuale','Mevcut sürüm')} (${EN()?'TR':'IT'}):</b><br>${esc(String(src).replace(/<[^>]+>/g,'')).slice(0,300)}`;
 $('#tdx').value=String(cur).replace(/<[^>]+>/g,'');
 $('#tdlg').showModal();$('#tdx').focus()},true);
document.addEventListener('DOMContentLoaded',()=>{});
const TB=$('#tipbox');
function showTip(el){const x=el.dataset.tip;if(!x)return;TB.textContent=x;TB.classList.add('on');
 const r=el.getBoundingClientRect(),b=TB.getBoundingClientRect();
 let left=r.left+r.width/2-b.width/2;
 left=Math.max(10,Math.min(left,innerWidth-b.width-10));
 let top=r.top-b.height-9;
 if(top<8)top=r.bottom+9;
 TB.style.left=left+'px';TB.style.top=top+'px'}
const hideTip=()=>TB.classList.remove('on');
document.addEventListener('mouseover',e=>{const i=e.target.closest('.i');if(i)showTip(i)});
document.addEventListener('mouseout',e=>{if(e.target.closest('.i'))hideTip()});
document.addEventListener('focusin',e=>{const i=e.target.closest('.i');if(i)showTip(i)});
document.addEventListener('focusout',hideTip);
document.addEventListener('scroll',hideTip,true);
document.addEventListener('click',e=>{const i=e.target.closest('.i');if(i){e.stopPropagation();showTip(i);setTimeout(hideTip,4500)}},true);
$('#tdc').onclick=()=>$('#tdlg').close();
$('#tdo').onclick=()=>{if(!TDT)return;const v=$('#tdx').value.trim();const{kind,key,target}=TDT;
 if(kind==='cell'){if(target==='en')S.compare.cellsEn[key]=v;else S.compare.cells[key]=v}
 if(kind==='row'){const r=S.compare.rows.find(x=>x.id===key);if(target==='en')r.labelEn=v;else r.label=v}
 if(kind==='col'){const c=S.compare.cols.find(x=>x.id===key);if(target==='en')c.nameEn=v;else{c.name=v;const a=S.acq.find(y=>y.id===key);if(a)a.name=v}}
 $('#tdlg').close();save(1);compare();toast(t('Traduzione salvata','Çeviri kaydedildi'))};
load();
const th=localStorage.getItem('lp_theme')||'light';document.documentElement.setAttribute('data-theme',th);
if(th==='dark')$('#thi').innerHTML='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
langUI();
gateLangUI();langUI();all();if(sessionStorage.getItem('lp_ok'))$('#gate').style.display='none';if(sbOn())pull();
</script></body></html>

layout:{overview:['stato','operatori','volume','roadmap','rischi'],revenue:['par','chart','models'],devices:['filter','chart','list','multi'],flow:['anim','split'],decisions:[
 {id:uid(),u:'alta',t:'Rispondere a MarketPay entro il 4 ottobre: accettare, chiedere proroga o declinare',tTr:'4 Ekim’e kadar MarketPay’e yanıt ver: kabul, uzatma talebi ya da ret',w:'Edoardo',s:'standby',n:'La proposta del 02/10/2026 è la più completa che abbiamo sull\'Italia dopo Nexi: rebate per circuito, terminali PAX, white label, titolarità del cliente nostra. Scade il 4. Anche solo una mail che chiede 30 giorni di proroga protegge lo sconto sul set up.',nTr:'02/10/2026 teklifi Nexi’den sonra İtalya için en eksiksiz olanı. 4’ünde doluyor. 30 günlük uzatma isteyen bir e-posta bile kurulum indirimini korur.'},
 {id:uid(),u:'alta',t:'Chiedere ad Adyen le condizioni tedesche applicate all\'Italia, non una quotazione nuova',tTr:'Adyen’den yeni bir teklif değil, Alman koşullarının İtalya’ya uygulanmasını iste',w:'Edoardo',s:'standby',n:'La Germania ha 0,27% e 0,023 €; la Francia 0,32% e 0,04 €. Chiedere "un preventivo" significa ripartire da zero. Chiedere l\'allineamento alle condizioni tedesche, citando il documento del 30/09/2026, sposta la trattativa su un\'asticella già concessa dentro lo stesso gruppo.',nTr:'Almanya %0,27 ve 0,023 €, Fransa %0,32 ve 0,04 € aldı. “Teklif” istemek sıfırdan başlamaktır. 30/09/2026 belgesini göstererek Alman koşullarına hizalanma istemek, müzakereyi aynı grup içinde zaten verilmiş bir çıtaya taşır.'},
 {id:uid(),u:'alta',t:'Chiedere ad Adyen la quotazione italiana allineata a Francia e Germania',tTr:'Adyen’den Fransa ve Almanya ile uyumlu İtalya teklifini iste',w:'Edoardo',s:'standby',n:'Email pronta. Serve capire se con 46.000 transazioni/mese rientriamo nei loro criteri o se l’Italia ha senso solo dentro un accordo a tre paesi.',nTr:'E-posta hazır. Ayda 46.000 işlemle kriterlerine girip girmediğimizi netleştirmek gerekiyor.'},
 {id:uid(),u:'alta',t:'Richiedere a MarketPay il modello economico: commissioni, costi terminale, revenue per noi',tTr:'MarketPay’den ekonomik modeli iste: komisyonlar, terminal maliyetleri, bizim gelirimiz',w:'Edoardo',s:'standby',n:'Sul fronte tecnico e white label MarketPay è oggi la risposta migliore. Manca completamente il lato economico: senza quello non è comparabile.',nTr:'Teknik ve white label tarafında MarketPay bugün en iyi yanıt. Ekonomik taraf tamamen eksik.'},
 {id:uid(),u:'media',t:'Decidere se il white label è un requisito vincolante o un desiderio',tTr:'White label’ın bağlayıcı bir gereklilik mi yoksa bir tercih mi olduğuna karar ver',w:'Direzione',s:'standby',n:'Se è vincolante, Nexi è fuori per contratto firmato e la scelta si restringe a MarketPay e Adyen. È la decisione che ordina tutte le altre.',nTr:'Bağlayıcıysa Nexi imzalı sözleşme gereği elenir ve seçim MarketPay ile Adyen’e daralır.'},'list']},
overview:[
 {id:uid(),k:'Nexi',v:'Due contratti firmati. Collaborazione commerciale 21/11/2025: 120 € per SmartPOS, 90 € per Mini, 20 € per SoftPOS, più management fee annuale a cluster ma solo per 3 anni per cliente. App Approval Policy 10/09/2026: l\'app Lp.Pay è sullo store, gratuita, senza revenue share.',kTr:'Nexi',vTr:'İki imzalı sözleşme. 21/11/2025 ticari iş birliği: SmartPOS için 120 €, Mini için 90 €, SoftPOS için 20 €, ayrıca küme bazlı yıllık yönetim ücreti ama müşteri başına yalnızca 3 yıl. 10/09/2026 App Approval Policy: Lp.Pay uygulaması mağazada, ücretsiz, gelir paylaşımı yok.',s:'ok'},
 {id:uid(),k:'Dojo / Paymentsense',v:'Referral integrato firmato 25/05/2026: 20% del Monthly Net Profit, 4% via rivenditori. Nessuna % di listino italiana pubblica.',kTr:'Dojo / Paymentsense',vTr:'25/05/2026 tarihli entegre referral sözleşmesi: Monthly Net Profit’in %20’si, bayiler üzerinden %4. İtalya için kamuya açık hiçbir tarife yok.',s:'ok'},
 {id:uid(),k:'Fabrick / Banca Sella',v:'80 € per POS attivato, zero revenue sul transato. Set contrattuale ISV in finalizzazione secondo scambio email.',kTr:'Fabrick / Banca Sella',vTr:'Aktive edilen POS başına 80 €, ciro üzerinden sıfır gelir. E-posta yazışmasına göre ISV sözleşme seti tamamlanma aşamasında.',s:'warn'},
 {id:uid(),k:'Adyen',v:'Nessun contatto avviato. Interchange++ con 0,11 € per transazione e markup dallo 0,60%, ma con una probabile fattura minima mensile intorno ai 1.000 € e un posizionamento enterprise. Dati da fonti di mercato, tutti da confermare con loro.',kTr:'Adyen',vTr:'Henüz temas kurulmadı. İşlem başına 0,11 € ve %0,60’tan başlayan markup ile Interchange++, ancak muhtemelen 1.000 € civarında asgari aylık fatura ve kurumsal bir konumlanma. Veriler piyasa kaynaklarından, tamamı onlarla teyit edilmeli.',s:''},
 {id:uid(),k:'MarketPay',kTr:'MarketPay',v:'<b>Proposta commerciale italiana completa, 02/10/2026.</b> Acquirer BANCOMAT in proprio, Principal Member Visa e Mastercard, presenza diretta in Italia. Rebate mensile dallo 0,10% allo 0,15% sul transato secondo il pacchetto, terminali PAX da 129 €, canone 3 €/mese, set up 500 €, T+1. White label completo e <b>titolarità della relazione con l\'esercente che resta nostra</b>. <span class="badge stop">L\'offerta scade il 04/10/2026</span>',vTr:'<b>Eksiksiz İtalya ticari teklifi, 02/10/2026.</b> Kendi bünyesinde BANCOMAT acquirer, Visa ve Mastercard Principal Member, İtalya’da doğrudan varlık. Pakete göre ciro üzerinden %0,10–%0,15 aylık rebate, 129 €’dan başlayan PAX terminalleri, ayda 3 € kira, 500 € kurulum, T+1. Tam white label ve <b>üye iş yeri ilişkisinin sahipliği bizde kalıyor</b>. <span class="badge stop">Teklif 04/10/2026’da doluyor</span>',s:'warn'},
 {id:uid(),k:'Il nodo Adyen: scala, non prezzo',kTr:'Adyen meselesi: ölçek, fiyat değil',v:'Tre paesi, tre situazioni diverse. <b>Germania</b>: offerta Adyen ufficiale del 30/09/2026, le condizioni migliori ottenute finora, con ramp-up progressivo che parte da zero impegni fino a giugno 2027. <b>Francia</b>: condizioni più care e 4 M€ al mese di impegno immediato. <b>Italia</b>: nessuna offerta, nessun contatto, e PagoBANCOMAT non prezzato da nessuna parte. La domanda da fare ad Adyen non è quanto costa, è se ci danno le condizioni tedesche anche in Italia.',vTr:'Üç ülke, üç farklı durum. <b>Almanya</b>: 30/09/2026 tarihli resmî Adyen teklifi, şimdiye kadarki en iyi koşullar, Haziran 2027’ye kadar sıfır taahhütle başlayan kademeli ramp-up. <b>Fransa</b>: daha pahalı koşullar ve ayda 4 M€ anında taahhüt. <b>İtalya</b>: teklif yok, temas yok, PagoBANCOMAT hiçbir yerde fiyatlandırılmamış. Adyen’e sorulacak soru ne kadara mal olduğu değil, Alman koşullarını İtalya’da da verip vermeyecekleri.',s:'stop'},
 {id:uid(),k:'La domanda da risolvere',v:'Premio secco (Sella) paga subito e smette. Quota sul margine (Dojo) paga poco all\'inizio e cresce col parco. Nexi sta in mezzo. Dipende da quanti POS installiamo nei primi 18 mesi.',kTr:'Çözülmesi gereken soru',vTr:'Sabit prim (Sella) hemen öder ve biter. Marj payı (Dojo) başta az öder ve parkla birlikte büyür. Nexi ortada durur. Karar, ilk 18 ayda kaç POS kuracağımıza bağlı.',s:''},
 {id:uid(),k:'Cosa manca per decidere',v:'MDR medio italiano di Dojo, conferma scritta sul white label Nexi, soglia di passaggio da bundle a % fee, contratto Fabrick.',kTr:'Karar için eksik olanlar',vTr:'Dojo’nun İtalya ortalama MDR’si, Nexi white label konusunda yazılı teyit, paketten yüzdeye geçiş eşiği, Fabrick sözleşmesi.',s:'stop'}],
risks:[
 {id:uid(),t:'L\'offerta MarketPay scade il 4 ottobre',tTr:'MarketPay teklifi 4 Ekim’de doluyor',x:'Emessa il 19/09/2026 con validità 15 giorni. È l\'unica proposta italiana completa che abbiamo oltre a Nexi, con numeri su ogni circuito, listino terminali e set up scontato da 5.000 a 500 €. Se scade senza risposta, la rinegoziazione riparte da zero e lo sconto sul set up non è garantito. Serve una decisione o almeno una richiesta di proroga scritta entro il 4.',xTr:'19/09/2026’da düzenlendi, 15 gün geçerli. Nexi dışında elimizdeki tek eksiksiz İtalya teklifi: her şema için rakamlar, terminal listesi ve 5.000 €’dan 500 €’ya indirilmiş kurulum. Yanıtsız dolarsa müzakere sıfırdan başlar.',l:'alto'},
 {id:uid(),t:'Rischiamo di accettare per l\'Italia condizioni peggiori di quelle tedesche',tTr:'İtalya için Alman koşullarından daha kötü koşulları kabul etme riski',x:'La Germania ha ottenuto 0,27% di markup già da zero volume e 0,023 € di processing fee. La Francia paga 0,32% e 0,04 €. Sono la stessa azienda, lo stesso gruppo, a un mese di distanza. Se andiamo in trattativa senza mettere sul tavolo l\'offerta tedesca, partiamo dal listino peggiore. I prezzi tedeschi scadono il 31/12/2026: è anche una scadenza nostra.',xTr:'Almanya sıfır hacimden itibaren %0,27 markup ve 0,023 € processing fee aldı. Fransa %0,32 ve 0,04 € ödüyor. Aynı şirket, aynı grup, bir ay arayla. Alman teklifini masaya koymadan müzakereye girersek en kötü listeden başlarız. Alman fiyatları 31/12/2026’da doluyor.',l:'alto'},
 {id:uid(),t:'Non raggiungiamo le soglie di volume Adyen',tTr:'Adyen hacim eşiklerine ulaşamıyoruz',x:'Adyen chiede 4 M€ al mese di volume carta minimo garantito. Il nostro scenario migliore italiano a 12 mesi è circa 1 M€ al mese. Il piano Francia dichiara apertamente che le conseguenze del mancato volume sono da chiarire per iscritto: firmare senza quella clausola significa assumere un impegno di cui non conosciamo il prezzo.',xTr:'Adyen ayda 4 M€ asgari garanti kart hacmi istiyor. İtalya’daki en iyi senaryomuz ayda yaklaşık 1 M€. Fransa planı, hacmin tutturulamaması halinde ne olacağının yazılı olarak netleştirilmesi gerektiğini açıkça söylüyor.',l:'alto'},
 {id:uid(),t:'Di MarketPay non conosciamo nulla di economico né di regolamentare',tTr:'MarketPay’in ne ekonomik ne de düzenleyici tarafını biliyoruz',x:'Le condizioni che conosciamo sono francesi e passano da Planet Monetic, fornitore locale di terminali. Per l\'Italia non sappiamo chi fa il convenzionamento, quale acquirer sta dietro, né se la struttura 50/50 regge. Il piano Francia dichiara aperti anche i costi del terminale e i costi fissi.',xTr:'Bildiğimiz koşullar Fransa’ya ait ve yerel terminal tedarikçisi Planet Monetic üzerinden geçiyor. İtalya için sözleşmeyi kimin yaptığı, arkasındaki acquirer ve %50/50 yapısının geçerli olup olmadığı bilinmiyor.',l:'alto'},
 {id:uid(),t:'La management fee Nexi dura solo 3 anni per cliente',x:'Allegato A: la fee annuale è riconosciuta per un massimo di 3 anni solari dall\'attivazione. Un cliente installato nel 2026 smette di pagarci nel 2029, anche se resta attivo. Il modello ricorrente ha una scadenza incorporata che nessuno ha ancora messo a piano.',tTr:'Nexi yönetim ücreti müşteri başına yalnızca 3 yıl sürer',xTr:'Ek A: yıllık ücret aktivasyondan itibaren en fazla 3 takvim yılı için tanınır. 2026’da kurulan bir müşteri 2029’da aktif olsa bile bize ödeme üretmeyi bırakır. Tekrarlayan modelin içine gömülü, henüz kimsenin plana koymadığı bir son kullanma tarihi var.',l:'alto'},
 {id:uid(),t:'Senza voucher inserito, Nexi non ci riconosce nulla',x:'Allegato A §3.1: il mancato o errato inserimento del voucher da parte del cliente impedisce a Nexi di rendicontare, in nessun caso. Tutta la nostra marginalità Nexi dipende da un codice che deve digitare l\'esercente.',tTr:'Voucher girilmezse Nexi bize hiçbir şey ödemez',xTr:'Ek A §3.1: müşterinin voucher’ı hiç ya da yanlış girmesi halinde Nexi hiçbir koşulda raporlama yapamaz. Nexi tarafındaki tüm marjımız, üye iş yerinin yazması gereken bir koda bağlı.',l:'alto'},
 {id:uid(),t:'Non possiamo vendere il POS, solo segnalarlo',x:'Art. 5.2: è vietato promuovere o collocare servizi di pagamento, attività riservata ex D.Lgs. 385/1993. Possiamo solo informare dell\'esistenza del voucher. La forza commerciale va istruita su questo confine o esponiamo il gruppo.',tTr:'POS’u satamayız, yalnızca yönlendirebiliriz',xTr:'Md. 5.2: 385/1993 sayılı kanun uyarınca saklı faaliyet olan ödeme hizmetlerini tanıtmak veya pazarlamak yasaktır. Yalnızca voucher’ın varlığını bildirebiliriz. Satış ekibi bu sınır konusunda eğitilmezse grubu riske atarız.',l:'alto'},
 {id:uid(),t:'Sullo store Nexi non incassiamo nulla',x:'App Approval Policy, Annex: l\'app Lp.Pay è gratuita per l\'esercente, 0 €/mese, nessun in-app purchase. Le licenze le fatturiamo sulla nostra piattaforma. Lo store è un canale di distribuzione, non di ricavo.',tTr:'Nexi mağazasından hiçbir gelir elde etmiyoruz',xTr:'App Approval Policy, Ek: Lp.Pay uygulaması üye iş yerine ücretsizdir, 0 €/ay, uygulama içi satın alma yok. Lisansları kendi platformumuzdan faturalarız. Mağaza bir dağıtım kanalıdır, gelir kanalı değil.',l:'medio'},
 {id:uid(),t:'Dojo può ridurre la nostra quota da solo',x:'Art. 2.1: revisione unilaterale della Compensation Share con 30 giorni di preavviso, e se la modifica non è "materiale" a loro giudizio non abbiamo diritto di recesso.',tTr:'Dojo payımızı tek başına düşürebilir',xTr:'Md. 2.1: Compensation Share 30 gün bildirimle tek taraflı gözden geçirilebilir ve değişiklik onların takdirine göre “esaslı” değilse fesih hakkımız doğmaz.',l:'alto'},
 {id:uid(),t:'Dojo può risolvere se cambia il nostro assetto',x:'Art. 3.3.1: variazione di proprietà o management di Lotus Pecas = risoluzione immediata. Art. 3.3.3: zero nuovi merchant in un trimestre, stesso esito.',tTr:'Yapımız değişirse Dojo sözleşmeyi feshedebilir',xTr:'Md. 3.3.1: Lotus Pecas’ın mülkiyet veya yönetim değişikliği = derhal fesih. Md. 3.3.3: bir çeyrekte sıfır yeni üye iş yeri, aynı sonuç.',l:'alto'},
 {id:uid(),t:'Con Sella non vediamo il nostro parco',x:'Nessun profilo super user: il transato dei nostri clienti è accessibile solo via API. Problema di controllo commerciale, non tecnico.',tTr:'Sella ile kendi parkımızı göremiyoruz',xTr:'Süper kullanıcı profili yok: müşterilerimizin cirosuna yalnızca API ile erişilebilir. Bu teknik değil, ticari kontrol sorunudur.',l:'medio'},
 {id:uid(),t:'Il modello Sella non ha coda',x:'80 € per POS e nulla di ricorrente: a installazioni ferme il ricavo va a zero, mentre Nexi e Dojo continuano.',tTr:'Sella modelinin kuyruğu yok',xTr:'POS başına 80 € ve tekrarlayan hiçbir şey: kurulumlar durduğunda gelir sıfıra iner, Nexi ve Dojo ise ödemeye devam eder.',l:'medio'},
 {id:uid(),t:'White label Nexi non confermato',x:'La pubblicazione dell\'app sullo store è certa, il branding completo dell\'esperienza POS no. Da mettere per iscritto prima di comunicarlo alla rete.',tTr:'Nexi white label teyit edilmedi',xTr:'Uygulamanın mağazada yayını kesin, POS deneyiminin tam markalaşması değil. Ağa duyurmadan önce yazılı hale getirilmeli.',l:'medio'}],

 cellsEn:{"mktpay|r1":"Acquirer ve <b>Visa, Mastercard, Carte Bancaires Principal Member</b>; Bancontact ve <b>BANCOMAT</b> acquirer. Perakendede doğmuş fintech (Carrefour 2016), bugün bağımsız, 2021’den beri %60 AnaCap kontrolünde. 3+ milyar işlem, 30 milyar akış, 320.000 terminal, 10 Avrupa pazarı.","mktpay|r2":"Fransa, 9 ülkede doğrudan operasyon","mktpay|r3":"ACPR <span class=\"badge warn\">Teyit edilecek</span>","mktpay|r4":"<b>Evet, pazarda mevcut.</b> Riccardo Porta, Sales Director Italy, Via de Castillia 23, Milano. BANCOMAT acquirer’ı: İtalyan yerel şeması kendi bünyesinde.","mktpay|r5":"<b>Lotus Pecas için ticari teklif, 02/10/2026.</b> Acquiring hizmetleri ve POS terminalleri üzerine Reseller Agreement. <span class=\"badge stop\">19/09/2026’dan 15 gün geçerli: 04/10/2026’da doluyor</span>","mktpay|r6":"<b>Toplam ciro üzerinden aylık tek rebate</b>, aylık ödenir. Üç paket: <b>Retail Plus</b> (yalnızca 1 M€ üstü cirolu üye iş yerleri) rebate %0,10 · <b>Retail Smart</b> %0,12 · <b>Retail Start</b> %0,15. Ticari ve uluslararası kartlarda tüm paketlerde sabit %0,10. Yemek kuponu işlem başına 0,16 €.","mktpay|r7":"Rebate paket düştükçe artıyor: Retail Start bize daha çok kazandırıyor (%0,15) ama üye iş yerine daha pahalı (Visa/MC %0,95). Kaldıraç hacim değil, fiyat konumlandırması.","mktpay|r8":"<b>Üye iş yerine fiyatı üç paket içinde biz belirliyoruz.</b> Retail Plus müşterisi 12 ay sonra 1 M€’yu aşmazsa otomatik Retail Smart’a geçer.","mktpay|r9":"Reseller Agreement, teklifte süre belirtilmemiş. <span class=\"badge warn\">Teyit edilecek</span>","mktpay|r10":"<b>Son üye iş yeriyle ticari ilişkinin tam sahipliği ve yönetimi bizde kalıyor.</b> Acquiring sözleşmesinin Nexi ile üye iş yeri arasında olduğu ve bizim yalnızca yönlendirebildiğimiz Nexi modelinden temel fark budur.","mktpay|f1":"Eksiksiz PAX gamı: A35 ve A33 PinPad, A920 Pro/Premium/Premium+ ve A8900 mobil, A8500 ve A8700 tezgah üstü, IM30 ve IM25 unattended, ayrıca A99 ve A77. Hepsi Android.","mktpay|f2":"Evet, Tap to Pay. İtalya teklifinde fiyat belirtilmemiş. <span class=\"badge warn\">Teyit edilecek</span>","mktpay|f3":"Evet, tüm PAX gamı Android. <b>A920’ler Lotus Pecas logosuyla özelleştirilebilir.</b>","mktpay|f4":"<b>Üye iş yeri tarifeleri, İtalya teklifi 02/10/2026.</b> Yerel paketler: BANCOMAT %0,50 (Retail Plus ve Smart) ya da %0,80 (Start); Visa/MC bireysel pakete göre %0,65 · %0,75 · %0,95. Ticari ve uluslararası kartlar tüm paketlerde aynı: Visa/MC yerel ticari %1,95, AB içi bireysel %0,80, AB içi ticari %2,10, AB dışı %2,49, Amex %1,60. Ayda 3 € kira. Tam detay Şemalar bölümünde.","mktpay|f5":"Terminal başına ayda 3 € kira. Proje kurulumu tek seferlik 500 € (5.000 €’dan indirimli). KYC ve onboarding üye iş yeri başına 10 €. İtiraz edilen işlem başına chargeback 20 €.","mktpay|f6":"Terminaller satın alma, fiyata 1 yıl garanti ve merkezi depoya sevkiyat dahil. Teklifte kiralama öngörülmemiş. <span class=\"badge warn\">Teyit edilecek</span>","mktpay|f7":"<b>Distributor Program.</b> Müşteri ilişkisi, terminal lojistiği ve deposu, yerel dağıtım ve birinci seviye destek bizde. MarketPay ikinci seviyeyi H24 garanti ediyor, altyapı izleme ve otomatik şebeke yedekleme dahil.","mktpay|f8":"<b>Evet, tam white label.</b> Terminalde Lotus Pecas ya da üye iş yeri logosu, A920’ler özelleştirilebilir, onboarding ve raporlama portalı markalanabilir.","mktpay|f9":"Üç yöntem: PAX üzerinde cihaz içi app-to-app Stand Alone, 17. Protokol, Cloud API. Üye iş yeri, mağaza, raporlama ve terminal parkı yönetimi için Market Pay Hub. Açık API ve SDK’larla Market Pay Docs.","mktpay|f10":"Reseller Agreement. Net alacak: processing ve acquiring giderleri alacak anında kesilir. Bizim ve müşterilerimiz için raporlama aracı. <b>Mikro-ticket maddesi:</b> 15 € üzerinde sabit bankalararası maliyetler emilir ve komisyon bize temiz gelir; 15 € altında işlem başına 0,02 € bize yansıtılır.","mktpay|f11":"<b>T+1</b>, fon alındığında, iş günlerinde, doğrudan Lotus Pecas müşterilerinin banka hesaplarına.","mktpay|f12":"Birinci seviye bizde, <b>ikinci seviye MarketPay tarafından H24 garanti</b>: 7/24 izleme, geliştirici desteği, otomatik şebeke yedekleme. PCI DSS, P2PE, SSC, MPoC, PIN Security sertifikaları. SLA ile beyan edilen %100 erişilebilirlik.","mktpay|i2":"PAX üzerinde cihaz içi app-to-app Stand Alone · 17. Protokol · Cloud API. Market Pay Docs API ve SDK sunuyor.","mktpay|i3":"Lotus Pecas uygulamayı gönderiyor, MarketPay sertifikalandırıyor ve çakışma olmadığını doğruluyor. <b>En fazla 5 iş günü.</b>","mktpay|i4":"MarketPay uygulamayı terminale uzaktan kuruyor. Lojistik ve fiziksel depo bizde.","mktpay|i5":"<b>Evet.</b> Lotus Pecas ya da üye iş yeri logosu. A920’ler özelleştirilebilir.","mktpay|i6":"<b>Evet.</b> Markalanabilir Market Pay Hub: üye iş yeri ve mağaza yönetimi, raporlama, terminal parkı, iadeler, ön provizyonlar, sahtecilik kuralları.","mktpay|i7":"İtalya teklifinde <b>hacim taahhüdü yok</b>. Tek kısıt 1 M€ üstü üye iş yerlerine ayrılmış Retail Plus paketi.","mktpay|i8":"10 Avrupa pazarı, 9 ülkede doğrudan operasyon, <b>İtalya dahil</b>.","mktpay|c1":"<b>Eksiksiz ticari teklif, 02/10/2026, İtalya perimetresi.</b> Nexi dışında İtalya rakamları yazılı olan tek operatör. <span class=\"badge stop\">04/10/2026’da doluyor</span>","mktpay|c2":"Fransa planı 02/09/2026: ilave marjın %50’si, temel pay %0,10 + işlem başına 0,02 €, Planet Monetic üzerinden. <b>İtalya teklifinden farklı yapı</b>: orada şema bazında sabit rebate var.","mktpay|c3":"Alman pazarı hakkında bilgi yok. <span class=\"badge warn\">Teyit edilecek</span>","mktpay|c4":"Ne İtalya’da ne Fransa’da hacim taahhüdü var.","mktpay|c5":"<b>İtalya teklifi 19/09/2026’dan 15 gün, yani 04/10/2026’ya kadar geçerli.</b> Reseller Agreement süresi belirtilmemiş.","mktpay|v1":"8","mktpay|v2":"8","mktpay|v3":"8","mktpay|v4":"7","mktpay|v5":"7","mktpay|v6":"8","mktpay|v7":"5","mktpay|g1":"Evet, eksiksiz PAX gamı","mktpay|g2":"Satın alma, kiralama değil. <span class=\"badge warn\">Teyit edilecek</span>","mktpay|g3":"Evet, Tap to Pay","mktpay|g4":"Evet: payment page, payment link, MOTO","mktpay|g5":"Evet, payment link","mktpay|g6":"Evet, terminalde QR kod","adyen|c1":"<b>Hiçbiri.</b> Temas kurulmadı, İtalya pazarı için teklif yok. İtalya’da baskın şema olan PagoBANCOMAT elimizdeki iki belgenin hiçbirinde fiyatlandırılmamış. <span class=\"badge warn\">Teyit edilecek</span>","adyen|c2":"<b>Fransa planı, 02/09/2026</b> (Mehmet Yılmaz’ın iç özeti, Adyen belgesi değil). Aylık kart hacmi dilimine göre Adyen payı: 4 M€ altı %0,32 · 4–8 %0,27 · 8–16 %0,24 · 16–32 %0,19 · 32 üzeri %0,17. İşlem ücreti: ayda ilk 250.000’de 0,04 €, sonrakilerde 0,035 €, 500.000 üzerinde 0,025 €. Tap to Pay +0,07 €. KYC 10 €. J+2 havale 0,25 €, J+1 %0,03 + 0,25 €. Uplift ve 3DS 0,02 €.","adyen|c3":"<b>Resmî Adyen teklifi, 30/09/2026</b> — özet değil, Adyen imzalı belge. <b>Fransa’dan daha iyi koşullar.</b> Visa/MC kredi ve banka kartlarında IC++ acquiring markup: ayda 10 M€ altı %0,27 · 10–20 %0,24 · 20–30 %0,21 · 30 üzeri %0,19. İade dahil işlem başına processing fee: ayda 1M işlem altı 0,023 € · 1–3M 0,018 € · 3–5M 0,016 € · 5M üzeri 0,013 €. Alman yerel şeması Girocard: 10 M€ altı %0,21 + 0,003 €, üzerinde %0,19 + 0,003 €. KYC onboarding 10 €. Payout 0,15 €. T+1 0,15 € + %0,03. Instant CashOut 0,25 € + %0,75. Terminal Fleet Manager terminal başına ayda 4 €. Chargeback 8 €. FX ana para birimlerinde %0,90, diğerlerinde %1,80. Android ve Apple Tap to Pay SoftPOS 0,06 €. Protect 0,05 €, Authenticate 0,05 €, Managed Risk %0,10. DCC: kart sahibine %3,95, kalan marj üye iş yeri ile Adyen arasında 25/75, platforma kalan marj %0,68.","adyen|c4":"<b>Fransa:</b> ayda 4 M€ asgari garanti kart hacmi, başlangıç 01/09/2026.<br><b>Almanya:</b> kademeli ramp-up — Oca-Haz 2027 taahhüt yok, Tem-Ara 2027 ayda 500.000 işlem, Oca 2028’den itibaren ayda 1.000.000 işlem ve 10 M€ Visa/MC kart hacmi. Temmuz 2027’ye kadar Cashout ve Capital dahil, alt üye iş yeri yazılı olarak vazgeçmedikçe her terminalde DCC.<br><b>İtalya:</b> teklif olmadığı için taahhüt de yok.","adyen|c5":"<b>Fransa:</b> 2 yıl başlangıç süresi.<br><b>Almanya:</b> 3 yıl asgari süre, fiyatlar 31/12/2026’ya kadar geçerli.<br>Alman son tarihi zamansal kaldıraçtır: 31 Aralık’tan sonra o koşullar garanti değil.","nexi|c1":"<b>İki imzalı sözleşme.</b> 21/11/2025 ticari iş birliği ve 10/09/2026 App Approval Policy. İtalya için elimizde yazılı belge bulunan tek operatör.","nexi|c2":"Uygulanamaz: Nexi Fransa’da faaliyet göstermiyor.","nexi|c3":"Uygulanamaz: Nexi Almanya’da faaliyet göstermiyor.","nexi|c4":"Asgari hacim yok. Sınır tersi yönde: yönetim ücreti müşteri başına 3 takvim yılından sonra duruyor.","nexi|c5":"Ticari iş birliği 3 yıl, zımni yıllık yenileme, 60 gün bildirimle fesih. App Approval Policy 01/01/2027’den itibaren 12 ay, 90 gün bildirim.","dojo|c1":"<b>25/05/2026 imzalı sözleşme.</b> Monthly Net Profit’in %20’si. Ancak İtalya acquiring tarifesi eksik: o olmadan %20 ölçülebilir değil.","dojo|c2":"LPPay France kapsamında uygulanamaz. <span class=\"badge warn\">doğrulanmadı</span>","dojo|c3":"LPPay Germany kapsamında uygulanamaz. <span class=\"badge warn\">doğrulanmadı</span>","dojo|c4":"Sözleşmesel asgari hacim yok, ancak bir çeyrekte sıfır yeni üye iş yeri fesih sebebi (md. 3.3.3).","dojo|c5":"25/05/2026’dan itibaren 3 yıl. Bitişten sonra 12 aylık ödeme kuyruğu.","sella|c1":"ISV programı e-postayla teyit edildi, sözleşme seti tamamlanma aşamasında. Aktive edilen POS başına 80 €, ciro üzerinden gelir yok. <span class=\"badge warn\">doğrulanmadı</span>","sella|c2":"Uygulanamaz: İtalyan operatör.","sella|c3":"Uygulanamaz: İtalyan operatör.","sella|c4":"E-postayla beyan edildiği üzere asgari hacim istenmiyor.","sella|c5":"Sözleşme seti henüz alınmadı. <span class=\"badge warn\">doğrulanmadı</span>","mktpay|c1":"<b>İtalya teklifi yok.</b> Teknik görüşme entegrasyon ve white label ile ilgili, ekonomik koşullarla değil. İtalya’da sözleşmeyi kimin yaptığı ve arkasındaki acquirer bilinmiyor. <span class=\"badge warn\">Teyit edilecek</span>","mktpay|c2":"<b>Fransa planı, 02/09/2026.</b> Interchange + scheme fee + MarketPay temel payı %0,10 + işlem başına 0,02 €. <b>İlave marjın %50’si bize.</b> CB banka kartı örneği: %0,99 satış − %0,215 kart maliyeti − %0,10 temel pay = %0,675 marj, bunun %0,3375’i bize. İşletme başına 500.000 € yıllık hacimde 1.687,50 €. Fransa’da terminal çözümü Planet Monetic üzerinden geçiyor.","mktpay|c3":"Alman pazarı hakkında bilgi yok. <span class=\"badge warn\">doğrulanmadı</span>","mktpay|c4":"Fransa’da <b>hacim taahhüdü yok</b>. Adyen’e karşı yapısal fark budur.","mktpay|c5":"Fransa’da beyan edilmiş <b>süre sınırı yok</b>.","adyen|f4":"<b>Fransa planından (02/09/2026) alınan koşullar, İtalya için geçerli değil.</b> Aylık kart hacmi dilimine göre Interchange++ artı Adyen payı: %0,32 (4 M€ altı) · %0,27 (4–8 M€) · %0,24 (8–16 M€) · %0,19 (16–32 M€) · %0,17 (32 M€ üzeri). İndirimler kademeli. İşlem ücreti: ayda ilk 250.000 işlemde 0,04 €, sonraki 250.000’de 0,035 €, 500.000 üzerinde 0,025 €. Tap to Pay +0,07 €/işlem. KYC 10 €/müşteri. Hesaplar arası transfer 0,20 €. J+2 havale 0,25 €, J+1 %0,03 + 0,25 €. Uplift ve 3DS 0,02 €/işlem. PagoBANCOMAT fiyatlandırılmamış: İtalya için sorulacak ilk şey bu.","adyen|i7":"<b>Ayda 4 M€ asgari garanti kart hacmi</b>, başlangıç 01/09/2026, ilk sözleşme süresi 2 yıl. Buna ulaşmak için ayda 10.000 € hacimli 400 işletme, ya da 20.000 € hacimli 200, ya da 40.000 € hacimli 100 işletme gerekiyor. İtalya’daki en iyi senaryomuz ayda yaklaşık 1 M€: <b>eşiğin dörtte biri</b>. Hacmin tutturulamaması halinde ne olacağı yazılı olarak netleştirilmeli (Fransa planı, s.7).","adyen|f5":"Fransa koşullarında aylık sabit ücret yok. Taahhüt hacim üzerine, asgari fatura üzerine değil. Vergiler hariç terminaller: NYC1 59 € · AMS1 199 € · V210 275 € · S1F2 395 €. İtalya için hepsi <span class=\"badge warn\">Teyit edilecek</span>","adyen|f8":"<b>Evet, Fransa planında teyit edildi:</b> white-label platform, kendi satış tarifemiz, ABD dahil çok ülkeli destek, KYC yönetimi dahil. Tüm işlemler kendi markamız altında, ülke bazında ayrı hesaplar tek platformdan yönetilir. SAQ A toplama ve onboarding sorumluluğu bize geçer.","adyen|r6":"<b>Maliyet üzerine marj:</b> Interchange++ artı Adyen payıyla alıyoruz ve kendi listemizle satıyoruz. Marj aradaki fark ve tamamen bizim. Ayrıca <b>Adyen Capital</b>: üye iş yerlerine cirolarına göre finansman, Adyen’in aldığı sabit hizmet ücretinin %20’si bize gelir payı olarak tanınıyor.","adyen|f2":"Evet. İşlem başına ek 0,07 € (Fransa planı). <b>Marja dikkat:</b> 20 €’luk bireysel kart ödemesinde SoftPOS 0,23 €, fiziksel terminal 0,16 € maliyet üretir; etkin oran %1,15 ve %0,80. %0,99 ile satıldığında fiziksel terminal 0,038 € kazandırır, SoftPOS 0,032 € kaybettirir. İtalya’da kullanılabilirlik <span class=\"badge warn\">Teyit edilecek</span>","mktpay|r6":"<b>İlave marjın %50’si</b> (Fransa planı, 02/09/2026, Fransa pazarı). Yapı: interchange + scheme fee + MarketPay temel payı %0,10, artı işlem başına 0,02 €. Üye iş yerine satış fiyatını biz belirliyoruz ve maliyeti aşan marj ikiye bölünüyor. <b>CB banka kartı örneği:</b> %0,99 satış − %0,215 kart maliyeti − %0,10 temel pay = %0,675 marj, bunun %0,3375’i bize. İşletme başına 500.000 € yıllık hacimde 1.687,50 €; 100 işletmede giderler öncesi 168.750 €/yıl. <b>Fransa koşulları, İtalya için yeniden müzakere edilmeli.</b>","mktpay|r1":"Acquirer ve PSP. Fransa’da TPE ve kabul çözümü, pazarın önde gelen terminal tedarikçilerinden Planet Monetic üzerinden geçiyor","mktpay|f1":"PAX Android TPE, Android ve iOS SoftPOS, çevrim içi ödeme. J+1 para aktarımı (Fransa planı)","mktpay|r7":"%50/50 ilave marj modeli kademesiz olarak hacimle büyüyor: ne kadar pahalı satarsak o kadar kazanırız. Tasarrufun hacim dilimlerinden geldiği Adyen’in tam tersi.","mktpay|r8":"<b>Üye iş yerine satış fiyatını biz belirliyoruz</b> (Fransa planı). Dördü arasında nihai fiyatlandırma kaldıracını bize bırakan tek operatör: büyük bir müşteriye kendi marjımızı azaltarak indirim yapabiliriz, izin istemeden.","mktpay|i7":"<b>Hacim taahhüdü yok</b> (Fransa planı). Adyen ile yapısal fark budur.","mktpay|r9":"Beyan edilmiş <b>sözleşme süresi sınırı yok</b> (Fransa planı).","mktpay|f10":"Hacim taahhüdü yok, süre sınırı yok. <b>Beyan edilen açık nokta:</b> terminal maliyetleri ve sabit giderler, Planet Monetic ile kapatılacak (Fransa planı).","mktpay|f11":"J+1 (Fransa planı)","mktpay|g4":"Evet, çevrim içi ödeme kapsamda (Fransa planı)","mktpay|g3":"Evet, Android ve iOS","mktpay|v2":"7","mktpay|f2":"Evet, Android ve iOS. Fiyat görüşülmedi (Fransa planı) <span class=\"badge warn\">doğrulanmadı</span>","mktpay|r1":"Acquirer ve PSP, BNP Paribas grubu","mktpay|r2":"Fransa <span class=\"badge warn\">doğrulanmadı</span>","mktpay|r3":"ACPR <span class=\"badge warn\">doğrulanmadı</span>","mktpay|r4":"Avrupa’da faal, İtalya varlığı <span class=\"badge warn\">doğrulanmadı</span>","mktpay|r5":"Sözleşme yok. Teknik görüşme başladı: entegre edilecek ilk çözüm POS. <span class=\"badge warn\">doğrulanmadı</span>","mktpay|r6":"Ekonomik model henüz bildirilmedi. <span class=\"badge warn\">doğrulanmadı</span>","mktpay|r7":"doğrulanmadı","mktpay|r8":"doğrulanmadı","mktpay|r9":"doğrulanmadı","mktpay|r10":"White label çözüm beyan edildi. Cihaz adlandırmasında kısıt bildirilmedi.","mktpay|f1":"PAX terminalleri <span class=\"badge warn\">doğrulanmadı</span>","mktpay|f2":"doğrulanmadı","mktpay|f3":"Evet, cihaz üzerinde app-to-app entegrasyonlu PAX Android","mktpay|f4":"doğrulanmadı","mktpay|f5":"doğrulanmadı","mktpay|f6":"doğrulanmadı","mktpay|f7":"Uygulama sertifikasyonu ve terminallere uzaktan dağıtım içeren ISV programı","mktpay|f8":"<b>Evet.</b> White label çözümler: terminalde Lotus Pecas logosu ya da son üye iş yerinin logosu gösterilebilir. Onboarding ve raporlama portalı da bizim logomuzu taşıyabilir.","mktpay|f9":"Üç yöntem: <b>Stand Alone</b> PAX üzerinde cihaz içi app-to-app, <b>17. Protokol</b>, <b>Cloud API</b>.","mktpay|f10" t edilecek</span>","sella|i7":"Asgari hacim istenmiyor.","sella|i8":"<b>Yalnızca İtalya.</b>","adyen|i2":"JSON Terminal API, yerel veya bulut, ara katman yok. Alt üye iş yerleri için Adyen for Platforms.","adyen|i3":"doğrulanmadı","adyen|i4":"Terminaller merkezden yönetilir, otomatik güncellenir.","adyen|i5":"Adyen for Platforms platform markalamasına izin verir. Terminalde markalama <span class=\"badge warn\">Teyit edilecek</span>","adyen|i6":"Raporlamalı ortak portalı. Markalama <span class=\"badge warn\">Teyit edilecek</span>","adyen|i7":"<b>Kritik nokta.</b> Fransa’ya sunulan teklif (30/09/2026) Temmuz 2027’den itibaren ayda 500.000, Ocak 2028’den itibaren ayda 1.000.000 işlem ve 10 M€ kart hacmi istiyor. İtalya’daki en iyi senaryomuz 12 ayda ayda yaklaşık 46.000 işlem: eşiğin on birde biri.","adyen|i8":"<b>Fransa, Almanya, İtalya ve AB’nin geri kalanı tek platformda.</b> Diğerlerine karşı yapısal üstünlüğü budur.","mktpay|i2":"<b>Üç yöntem:</b> PAX üzerinde cihaz içi app-to-app Stand Alone · 17. Protokol · Cloud API.","mktpay|i3":"Lotus Pecas uygulamayı MarketPay’e iletir, onlar sertifikalandırır ve kendi uygulamalarıyla çakışma olmadığını doğrular. Beyan edilen süre <b>en fazla 5 iş günü</b>.","mktpay|i4":"<b>MarketPay uygulamamızı terminale uzaktan kurar.</b>","mktpay|i5":"<b>Evet.</b> Lotus Pecas logosu ya da son üye iş yerinin logosu.","mktpay|i6":"<b>Evet,</b> kendi logomuzla onboarding ve raporlama portalı.","mktpay|i7":"doğrulanmadı","mktpay|i8":"Avrupa <span class=\"badge warn\">doğrulanmadı</span>","nexi|r1": "Acquirer ve issuer, Nexi grubu", "nexi|r2": "İtalya", "nexi|r3": "İtalya Merkez Bankası — IMEL sicili md. 114-quater, no. 32875.7", "nexi|r4": "Başlıca yerel operatör", "nexi|r5": "İki ayrı sözleşme. <b>Ticari İşbirliği Sözleşmesi</b> 21/11/2025 tarihli, 3 yıl, zımni yıllık yenileme, her iki taraf da 60 gün önceden bildirimle çıkabilir. <b>App Approval Policy</b> 10/09/2026 tarihli, 01/01/2027’den itibaren 12 ay, otomatik yenileme, 90 gün bildirim.", "nexi|r6": "21/11/2025 tarihli Ticari İşbirliği Sözleşmesi, Ek A. Tek seferlik aktivasyon: SmartPOS 120 €, yazıcılı SmartPOS Mini 90 €, SoftPOS 20 €, tümü KDV hariç. Cihaz başına işlem kümesine göre yıllık yönetim ücreti: XS 20 · S 60 · M 120 · L 240 · XL 450 €. Ertesi yılın 15 Şubat’ına kadar tek seferde ödenir ve <b>aktivasyondan itibaren en fazla 3 takvim yılı</b> sürer. Yalnızca dönemde en az bir işlem yapmış POS’lar sayılır. 395 €/yıl OnSet lisansı ile 95 veya 195 € bakım bizim fiyat listemizdir, Nexi’nin değil.", "nexi|r7": "Paketten ciro üzerinden yüzdeye geçiş yönetimin bir varsayımıdır: <b>imzalı sözleşmelerin hiçbirinde yer almaz</b>. Eşik ve yüzde tamamen müzakereye açıktır. Yönetim ücretindeki 3 takvim yılı sınırına dikkat: dördüncü yılda bugün aktive edilen bir müşteri sıfır eder. <span class=\"badge warn\">doğrulanmadı</span>", "nexi|r8": "Ek A’da indirim öngörülmüyor: tutarlar küme bazında sabittir. İndirim md. 11.1 uyarınca yazılı değişiklik olarak müzakere edilmelidir. <span class=\"badge warn\">doğrulanmadı</span>", "nexi|r9": "Ticari işbirliği: 21/11/2025’ten itibaren 3 yıl, zımni yıllık yenileme, 60 gün bildirimle serbest çıkış. App Approval Policy: 01/01/2027’den itibaren 12 ay, 90 gün bildirim. Sona ermede Nexi yalnızca tahakkuk edeni öder, sonraki dönemler için hiçbir şey ödemez.", "nexi|r10": "Lp.Pay uygulaması üye iş yerine ücretsizdir, 0 €/ay, uygulama içi satın alma yok: Nexi bizim aboneliklerimizden pay almaz, biz de mağazadan gelir elde etmeyiz. Ücretleri SmartPOS dışında, Lotus Pecas Platform üzerinden tahsil ederiz. Uygulama Nexi ile veya önyüklü uygulamalarla rekabet edemez, reklam banner’ı ve ikinci ekranın paraya çevrilmesi yasaktır, referans trafiği yasaktır. Mesai saatlerinde İtalyanca veya İngilizce destek zorunludur: zayıf SLA mağazadan kaldırılma sebebidir.", "nexi|f1": "Çift ekranlı SmartPOS, yazıcılı SmartPOS Mini, Bluetooth Mobile POS, SoftPOS", "nexi|f2": "Evet — 10 € tek seferlik, aylık ücret yok. PagoBANCOMAT yalnızca Android’de, JCB/UPI hariç", "nexi|f3": "Kendi uygulama mağazası olan Android SmartPOS", "nexi|f4": "LP açılış sayfası listesi, 22/09/2026 — Italia+: Visa/MC bireysel %0,89 (AEA dışı +%0,65), ticari %1,69, PagoBANCOMAT %0,69, JCB/UPI %2,49, 3.000 €’ya kadar Amex %0. Welcome Special tek oran %1,49. CNP +%0,95. 30 € altı: −%0,05.", "nexi|f5": "SmartPOS 12 €/ay + 49 € kurulum · Mini 10 €/ay + 49 € · SoftPOS ve Mobile POS aylık ücretsiz · Protection Plus PCI 2,50 € + 7,50 € tek seferlik", "nexi|f6": "Nexi acquiring sözleşmesiyle birlikte aylık kira", "nexi|f7": "Bayi programı + SmartPOS mağazasında ISV yayını", "nexi|f8": "<b>Belgelerde yanıtı bulundu: hayır.</b> App Approval Policy §10: geliştiriciler cihazı “Nexi SmartPOS” olarak adlandırmak ZORUNDADIR. Lp.Pay uygulaması mağazada bizim markamızla yer alır ama terminal Nexi’nin kalır. Cihazda white label yok.", "nexi|f9": "Android SmartPOS SDK + katalog API + content provider. Her apk, güncellemeler dahil, Developer Portal ve Nexi incelemesinden geçer. Sertifikasyondan sonra ek kod indirmek, root erişimi ve açılışta lisans ekranı yasaktır. Demo ve beta sürümler mağazada dağıtılamaz. Test cihazları ödünç sözleşmesi 03/12/2025, 11 ay.", "nexi|f10": "Acquiring sözleşmesi doğrudan Nexi ile üye iş yeri arasında imzalanır: <b>ödeme hizmetlerini tanıtamaz ve pazarlayamayız</b> (md. 5.2, 385/1993 sayılı kanun hükmünde saklı faaliyet). Tek aracımız <b>voucher</b>’dır: müşteri kodu girmezse Nexi bize hiçbir şey ödemez (Ek A §3.1). Raporlama altı aylıktır. Üye iş yeri acquiring’den çıkarsa ödemelerimiz anında durur. Yetkili mahkeme Milano. Ödünç alınan malzeme iade edilmelidir, terminal başına 500 €’ya kadar ceza.", "nexi|f11": "İtalyan banka hesabıyla ertesi iş günü", "nexi|f12": "İtalya’dan 7/24 telefon desteği, haftanın yedi günü", "nexi|g1": "Evet", "nexi|g2": "Evet, aylık kira", "nexi|g3": "Evet", "nexi|g4": "Evet (XPay, açılış sayfası dışında)", "nexi|g5": "Evet, Pay-by-Link dahil, link işlemi başına 0,30 €", "nexi|g6": "doğrulanmadı", "dojo|r1": "Acquirer, Paymentsense markası", "dojo|r2": "İrlanda — Paymentsense Ireland Ltd, sicil 542166", "dojo|r3": "Central Bank of Ireland <span class=\"badge warn\">doğrulanmadı</span>", "dojo|r4": "İtalya ülke müdürü, 150’den fazla çalışan beyanı", "dojo|r5": "Integrated Referral Partner Agreement, 25/05/2026, 3 yıl", "dojo|r6": "Yönlendirdiğimiz üye iş yerlerinin Monthly Net Profit’inin %20’si, bayilerimizin yönlendirdiklerinde %4. Aynı üye iş yerinde asla ikisi birden olmaz.", "dojo|r7": "Paymentsense payı ve maliyetleri 30 gün bildirimle tek taraflı değiştirebilir (md. 2.1).", "dojo|r8": "Dojo tercihine bağlı ek ücret yasak (md. 1.7.7), üye iş yeri fiyatlandırması Paymentsense onayına tabi (md. 1.10).", "dojo|r9": "25/05/2026’dan itibaren 3 yıl. Paymentsense 90 gün bildirimle, mülkiyet veya yönetim değişirse ya da bir çeyrekte yeni üye iş yeri eklenmezse derhal feshedebilir. 12 aylık ödeme kuyruğu.", "dojo|r10": "Uygulanamaz: mağaza yok, QA sonrası doğrudan entegrasyon.", "dojo|f1": "Dojo Go taşınabilir, sabit tezgah POS, cep tipi <span class=\"badge warn\">doğrulanmadı</span>", "dojo|f2": "doğrulanmadı", "dojo|f3": "doğrulanmadı", "dojo|f4": "İtalya için yayımlanmış tarife yok. Resmî kaynaktan hiçbir yüzde alınamadı. <span class=\"badge warn\">doğrulanmadı</span>", "dojo|f5": "doğrulanmadı", "dojo|f6": "doğrulanmadı", "dojo|f7": "Referral, bayi ve ISV / yazılım evi kanalları", "dojo|f8": "Hariç: Paymentsense yazılımını alt lisanslamak veya değiştirmek yasak (md. 1.8)", "dojo|f9": "ISV ve ECR entegrasyonu için API, 50’den fazla İtalyan kasa yazılımı entegre. Entegrasyon ancak QA ve yazılı onaydan sonra geçerlidir (md. 1.7.4).", "dojo|f10": "İrlanda hukuku ve mahkemeleri. Münhasırlık yok (md. 1.5). 90 gün bildirimle fesih; bir çeyrekte yeni üye iş yeri yoksa veya mülkiyet ya da yönetimimiz değişirse derhal fesih (md. 3.3). 12 aylık ödeme kuyruğu. 18 ay rakip çalıştırmama. Sorumluluk üst sınırı 10.000 €.", "dojo|f11": "Ertesi gün (Dojo kaynağı)", "dojo|f12": "Haftanın yedi günü İtalyanca destek, %99,99 çalışma süresi beyanı", "dojo|g1": "Evet", "dojo|g2": "doğrulanmadı", "dojo|g3": "doğrulanmadı", "dojo|g4": "Evet <span class=\"badge warn\">doğrulanmadı</span>", "dojo|g5": "doğrulanmadı", "dojo|g6": "doğrulanmadı", "sella|r1": "Teknoloji sağlayıcı Fabrick, acquiring Banca Sella, terminaller Axerve", "sella|r2": "İtalya", "sella|r3": "İtalya Merkez Bankası", "sella|r4": "Evet, İtalyan bankacılık grubu", "sella|r5": "ISV ortak programı, sözleşme seti tamamlanma aşamasında (e-posta 2026). <span class=\"badge warn\">doğrulanmadı</span>", "sella|r6": "Aktive edilen POS başına 80 €. Ciro üzerinden pay yok.", "sella|r7": "Ortaklık büyüdükçe yıllar içinde gözden geçirilebilir model, e-postayla beyan edildi, sözleşmeye bağlanmadı. <span class=\"badge warn\">doğrulanmadı</span>", "sella|r8": "Müşteriler için standart koşullar: üye iş yeri fiyatlandırmasında beyan edilmiş bir manevra alanı yok.", "sella|r9": "Sözleşme seti henüz alınmadı. <span class=\"badge warn\">doğrulanmadı</span>", "sella|r10": "Uygulanamaz. <span class=\"badge warn\">doğrulanmadı</span>", "sella|f1": "Axerve gamı, kiralık veya satın alma", "sella|f2": "doğrulanmadı", "sella|f3": "doğrulanmadı", "sella|f4": "Açıklanmadı: Banca Sella acquiring standart koşullarla. <span class=\"badge warn\">doğrulanmadı</span>", "sella|f5": "doğrulanmadı", "sella|f6": "Evet, kiralık veya satın alma (Axerve)", "sella|f7": "Evet. eCommerce bileşeni olmayan bir ISV kabul ediliyor, e-postayla teyit edildi.", "sella|f8": "doğrulanmadı", "sella|f9": "Kasa bağlantısı için standart 17. kanal ya da terminallere uzaktan bağlanmak için API anahtarı", "sella|f10": "Asgari hacim yok. KYC, underwriting ve üye iş yeri ilişkisinin sahipliği Banca Sella’da; teknoloji ve lojistik desteği Fabrick’te.", "sella|f11": "doğrulanmadı", "sella|f12": "Birinci seviye ve lojistik Fabrick’te, acquiring ve itirazlar Banca Sella’da. Üye iş yeri için panel var; bizim için süper kullanıcı profili yok, ciro yalnızca API ile görülebilir.", "sella|g1": "Evet", "sella|g2": "Evet", "sella|g3": "doğrulanmadı", "sella|g4": "Evet (Axerve, kapsamımız dışında)", "sella|g5": "doğrulanmadı", "sella|g6": "doğrulanmadı", "adyen|r1": "Tek platformda acquirer, processor ve issuer", "adyen|r2": "Hollanda — Adyen N.V., Hollanda banka lisansı", "adyen|r3": "De Nederlandsche Bank. Milano’da İtalya şubesi. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|r4": "Evet, Milano ofisi. Beyan edilen odak: kurumsal ve platformlar", "adyen|r5": "Henüz temas kurulmadı. Ortak programı, ortak başvuru formu üzerinden POS entegratörlerine ve yazılım evlerine açık.", "adyen|r6": "Ortak programı finansal ödüller, referral ve pazarlama desteğinden söz ediyor. Kamuya açık yüzde yok: piyasada ISV modelleri acquirer markup’ından pay almaktan tek seferlik referral’a kadar değişiyor. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|r7": "Ortaklık pekiştikçe avantajlar artıyor. Acquirer markup’ı aylık hacim büyüdükçe düşüyor: zaman içindeki iyileşme kaldıracı model değişikliği değil, budur. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|r8": "Interchange++ üye iş yerine her bileşeni gösterir: indirim yalnızca Adyen markup’ı üzerinden müzakere edilebilir, geçişli maliyet olan interchange ve scheme fee üzerinden değil. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|r9": "doğrulanmadı", "adyen|r10": "Ortak pazar yeri var ama koşullar kamuya açık değil. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f1": "Perakende, konaklama, etkinlik ve teslimat için PCI PTS 6 sertifikalı kendi terminal gamı", "adyen|f2": "iPhone ve Android üzerinde Tap to Pay birçok Avrupa pazarında aktif. İtalya’daki durum <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f3": "Castles ve benzeri donanım üzerine kurulu kendi gamı, PCI PTS 6 sertifikalı. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f4": "Adyen’in kendi beyanıyla Interchange++: interchange + scheme fee + acquirer markup. <b>Avrupa’da işlem başına sabit 0,11 €</b> artı ciro üzerinden %0,60’tan başlayan ve aylık hacim büyüdükçe düşen markup (kaynak: help.adyen.com ve 2026 piyasa analizleri). Avrupa bireysel kartlarında ortalama toplam maliyet yaklaşık %1. İtiraz başına yaklaşık 25 €. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f5": "Beyan edilen aylık ücret veya kurulum bedeli yok, ancak 2026 tarihli birçok piyasa analizi <b>1.000 € civarında asgari aylık fatura</b> bildiriyor: bu eşiğin altında aradaki fark yine ödenir. Küçük bir park için asıl gizli maliyet budur. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f6": "Adyen listesinden satın alma veya kiralama, İtalya için fiyatlar kamuya açık değil. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f7": "Özel portal, ortak yöneticisi, kalite rozeti ve pilotlara erken erişim içeren ortak programı. POS ve sistem entegratörleri için açık kanal.", "adyen|f8": "Adyen for Platforms, alt üye iş yerlerini kendi platformumuz altında yönetmemizi sağlar; ihtiyacımıza en yakın white label biçimi budur. Ancak SAQ A toplamayı ve onboarding sorumluluğunu bize yükler. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f9": "JSON tabanlı Terminal API, yerel veya bulut, ara katman gerekmez. Terminaller merkezden yönetilir ve otomatik güncellenir. Kamuya açık eksiksiz dokümantasyon.", "adyen|f10": "Self servis kayıt yok: piyasa analizlerine göre haftalar süren bir satış süreci var. Tarihsel olarak orta ve büyük ölçeğe yönelik, hacim eşikleri bugün gevşemiş ama kalkmamış. Bizim için asıl soru kriterlerine girip girmediğimiz. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f11": "Ödeme sıklığı ve para birimi yapılandırılabilir, risk profiline göre tipik olarak günlük veya haftalık. İtalya süreleri <span class=\"badge warn\">Teyit edilecek</span>", "adyen|f12": "Özel ortak yöneticisi ve ortak portalı ile kurumsal destek. Sözleşmesel SLA ve İtalyanca kapsam <span class=\"badge warn\">Teyit edilecek</span>", "adyen|g1": "Evet", "adyen|g2": "Terminal kiralama mevcut, koşullar kamuya açık değil. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|g3": "Birçok AB pazarında Tap to Pay. <span class=\"badge warn\">Teyit edilecek</span>", "adyen|g4": "Evet", "adyen|g5": "Evet (pay by link) <span class=\"badge warn\">Teyit edilecek</span>", "adyen|g6": "Platform QR ve yerel cüzdanları destekler. <span class=\"badge warn\">Teyit edilecek</span>"},

 'adyen|i7':"<b>Il punto critico.</b> La proposta alla Francia (30/09/2026) chiede 500.000 transazioni/mese da luglio 2027 e 1.000.000/mese da gennaio 2028, con 10 M€ di volume carta. Il nostro scenario migliore italiano a 12 mesi vale circa 46.000 transazioni/mese: un undicesimo della soglia.",
 'adyen|i8':"<b>Francia, Germania, Italia e resto EU su un'unica piattaforma.</b> È il suo vantaggio strutturale rispetto a tutti gli altri.",
 'mktpay|i2':"<b>Tre modalità:</b> Stand Alone con app-to-app on-device su PAX · Protocollo 17 · Cloud API.",
 'mktpay|i3':"Lotus Pecas gira l'app a MarketPay, che certifica e verifica l'assenza di conflitti con la propria. <b>Massimo 5 giorni lavorativi</b> dichiarati.",

 'mktpay|i5':"<b>Sì.</b> Logo Lotus Pecas oppure logo del merchant finale.",

 'adyen|c1':"<b>Nessuna.</b> Zero contatti avviati, nessuna quotazione per il mercato italiano. PagoBANCOMAT, che in Italia è lo schema dominante, non è prezzato in nessuno dei due documenti che abbiamo. <span class=\"badge warn\">Da confermare</span>",
 'adyen|c2':"<b>Piano Francia, 02/09/2026</b> (sintesi interna di Mehmet Yılmaz, non documento Adyen). Quota Adyen per fascia di volume carta mensile: 0,32% sotto 4 M€ · 0,27% da 4 a 8 · 0,24% da 8 a 16 · 0,19% da 16 a 32 · 0,17% oltre 32. Fee per transazione 0,04 € sulle prime 250.000/mese, 0,035 € sulle successive, 0,025 € oltre 500.000. Tap to Pay +0,07 €. KYC 10 €. Bonifico J+2 0,25 €, J+1 0,03% + 0,25 €. Uplift e 3DS 0,02 €.",
 'adyen|c3':"<b>Offerta Adyen ufficiale, 30/09/2026</b> — documento firmato Adyen, non una sintesi. <b>Condizioni migliori della Francia.</b> Acquiring markup IC++ su Visa/MC credito e debito: 0,27% sotto 10 M€/mese · 0,24% da 10 a 20 · 0,21% da 20 a 30 · 0,19% oltre 30. Processing fee per transazione, rimborsi inclusi: 0,023 € sotto 1M tx/mese · 0,018 € da 1 a 3M · 0,016 € da 3 a 5M · 0,013 € oltre 5M. Girocard, schema domestico tedesco: 0,21% + 0,003 € sotto 10 M€, 0,19% + 0,003 € oltre. KYC onboarding 10 €. Payout 0,15 €. T+1 0,15 € + 0,03%. Instant CashOut 0,25 € + 0,75%. Terminal Fleet Manager 4 €/terminale/mese. Chargeback 8 €. FX 0,90% sulle valute principali, 1,80% sulle altre. SoftPOS Android e Apple Tap to Pay 0,06 €. Protect 0,05 €, Authenticate 0,05 €, Managed Risk 0,10%. DCC: commissione al titolare 3,95%, margine residuo diviso 25/75 tra merchant e Adyen, margine per la piattaforma 0,68%.",
 'adyen|c4':"<b>Francia:</b> 4 M€ al mese di volume carta minimo garantito, decorrenza 01/09/2026.<br><b>Germania:</b> ramp-up progressivo — nessun impegno gen-giu 2027, 500.000 transazioni/mese lug-dic 2027, 1.000.000 transazioni/mese più 10 M€ di volume carta Visa/MC da gen 2028. Include Cashout e Capital entro luglio 2027 e DCC su ogni terminale salvo rinuncia scritta del sub-merchant.<br><b>Italia:</b> nessun impegno perché nessuna offerta.",
 'adyen|c5':"<b>Francia:</b> 2 anni di durata iniziale.<br><b>Germania:</b> 3 anni di durata minima, prezzi validi fino al 31/12/2026.<br>La scadenza tedesca è la leva temporale: dopo il 31 dicembre quelle condizioni non sono più garantite.",

 'mktpay|c1':"<b>Nessuna quotazione italiana.</b> Lo scambio tecnico riguarda integrazione e white label, non le condizioni economiche. Chi faccia il convenzionamento in Italia e quale acquirer stia dietro non è noto. <span class=\"badge warn\">Da confermare</span>",
 'mktpay|c2':"<b>Piano Francia, 02/09/2026.</b> Interchange + scheme fee + quota base MarketPay 0,10% + 0,02 € per transazione. <b>50% del margine aggiuntivo a noi.</b> Esempio su carta di debito CB: 0,99% di vendita − 0,215% di costo carta − 0,10% di quota base = 0,675% di margine, di cui 0,3375% a noi. Su 500.000 € di volume annuo per esercente sono 1.687,50 €. In Francia la soluzione terminale passa da Planet Monetic.",

 'mktpay|r1':"Acquirer e <b>Principal Member Visa, Mastercard e Carte Bancaires</b>; acquirer Bancontact e <b>BANCOMAT</b>. Fintech nata nel retail (Carrefour 2016), oggi indipendente, controllata al 60% da AnaCap dal 2021. 3+ miliardi di transazioni, 30 miliardi di flussi gestiti, 320.000 terminali, 10 mercati europei.",

 'mktpay|r4':"<b>Sì, mercato presidiato.</b> Riccardo Porta, Sales Director Italy, Via de Castillia 23, Milano. È acquirer BANCOMAT: lo schema domestico italiano è coperto in proprio, non rivenduto.",
 'mktpay|r5':"<b>Proposta commerciale per Lotus Pecas, 02/10/2026.</b> Reseller Agreement sui servizi di acquiring e sui terminali POS. <span class=\"badge stop\">Valida 15 giorni dal 19/09/2026: scade il 04/10/2026</span>",
 'mktpay|r6':"<b>Rebate mensile unico sul volume totale transato</b>, liquidato mensilmente. Tre pacchetti: <b>Retail Plus</b> (solo merchant oltre 1 M€ di fatturato) rebate 0,10% · <b>Retail Smart</b> 0,12% · <b>Retail Start</b> 0,15%. Su carte business e internazionali il rebate è 0,10% fisso in tutti i pacchetti. Buoni pasto 0,16 € a transazione.",
 'mktpay|r7':"Il rebate cresce al scendere del pacchetto: Retail Start rende di più a noi (0,15%) ma costa di più al merchant (0,95% su Visa/MC). La leva è il posizionamento di prezzo, non il volume.",
 'mktpay|r8':"<b>Il prezzo al merchant lo decidiamo noi</b> entro i tre pacchetti. Se dopo 12 mesi un merchant Retail Plus non supera 1 M€ di transato, scatta automaticamente Retail Smart.",
 'mktpay|r9':"Reseller Agreement, durata non indicata nella proposta. <span class=\"badge warn\">Da confermare</span>",
 'mktpay|r10':"<b>Manteniamo piena titolarità e gestione della relazione commerciale con l'esercente finale.</b> È la differenza sostanziale con Nexi, dove il contratto acquiring è tra Nexi e il merchant e noi possiamo solo segnalare.",
 'mktpay|f1':"Gamma PAX completa: PinPad A35 e A33, mobile A920 Pro/Premium/Premium+ e A8900, counter top A8500 e A8700, unattended IM30 e IM25, più A99 e A77. Tutti Android.",
 'mktpay|f2':"Sì, Tap to Pay. Prezzo non indicato nella proposta italiana. <span class=\"badge warn\">Da confermare</span>",
 'mktpay|f3':"Sì, tutta la gamma PAX è Android. <b>Gli A920 sono personalizzabili con il logo Lotus Pecas.</b>",
 'mktpay|f4':"<b>Tariffe al merchant, proposta italiana 02/10/2026.</b> Pacchetti nazionali: BANCOMAT 0,50% (Retail Plus e Smart) o 0,80% (Start); Visa/MC consumer 0,65% · 0,75% · 0,95% secondo il pacchetto. Carte business e internazionali, uguali in tutti i pacchetti: Visa/MC domestic business 1,95%, intra-EEA consumer 0,80%, intra-EEA business 2,10%, extra-UE 2,49%, Amex 1,60%. Canone 3 €/mese. Dettaglio completo nella sezione Circuiti.",
 'mktpay|f5':"Canone 3 €/mese per terminale. Set up progetto 500 € una tantum (scontato da 5.000 €). KYC e onboarding 10 €/esercente. Chargeback 20 € per transazione contestata.",
 'mktpay|f6':"Terminali in acquisto, prezzo comprensivo di 1 anno di garanzia e spedizione al magazzino centrale. Noleggio non previsto nella proposta. <span class=\"badge warn\">Da confermare</span>",
 'mktpay|f7':"<b>Distributor Program.</b> Noi gestiamo relazione cliente, logistica e magazzino terminali, dispatch locale e supporto di primo livello. MarketPay garantisce il secondo livello H24, monitoraggio infrastruttura e fallback automatico di rete.",
 'mktpay|f8':"<b>Sì, white label completo.</b> Logo Lotus Pecas o del merchant sul terminale, terminali A920 personalizzabili, portale di onboarding e reportistica brandizzabile.",
 'mktpay|f9':"Tre modalità: Stand Alone app-to-app on-device su PAX, Protocollo 17, Cloud API. Market Pay Hub per gestione merchant, store, reporting e parco terminali. Market Pay Docs con API e SDK pubblici.",
 'mktpay|f10':"Reseller Agreement. Accredito netto: le spese di processing e acquiring sono prelevate al momento dell'accredito. Strumento di reporting per noi e per i nostri clienti. <b>Clausola micro-ticket:</b> sopra i 15 € i costi fissi interbancari sono assorbiti e la commissione ci arriva pulita; sotto i 15 € ci viene addebitato 0,02 € per transazione.",
 'mktpay|f11':"<b>T+1</b> a ricevimento fondi, nei giorni lavorativi, direttamente sui conti bancari dei clienti di Lotus Pecas.",
 'mktpay|f12':"Primo livello a noi, <b>secondo livello H24 garantito da MarketPay</b> con monitoraggio 24/7, assistenza sviluppatori e fallback automatico di rete. Certificazioni PCI DSS, P2PE, SSC, MPoC, PIN Security. Disponibilità dichiarata 100% con SLA.",
 'mktpay|i2':"Stand Alone app-to-app on-device su PAX · Protocollo 17 · Cloud API. Market Pay Docs espone API e SDK.",
 'mktpay|i3':"Lotus Pecas invia l'app, MarketPay certifica e verifica l'assenza di conflitti. <b>Massimo 5 giorni lavorativi.</b>",
 'mktpay|i4':"MarketPay installa l'app da remoto sul terminale. Noi gestiamo logistica e magazzino fisico.",
 'mktpay|i5':"<b>Sì.</b> Logo Lotus Pecas o del merchant. Gli A920 sono personalizzabili.",
 'mktpay|i6':"<b>Sì.</b> Market Pay Hub brandizzabile: gestione merchant e store, reporting, gestione parco terminali, rimborsi, pre-autorizzazioni, regole antifrode.",
 'mktpay|i7':"<b>Nessun impegno di volume</b> nella proposta italiana. Il solo vincolo è il pacchetto Retail Plus, riservato a merchant sopra 1 M€.",
 'mktpay|i8':"10 mercati europei, 9 paesi con operatività diretta, <b>Italia inclusa</b>.",
 'mktpay|c1':"<b>Proposta commerciale completa, 02/10/2026, perimetro Italia.</b> È l'unico operatore oltre a Nexi con numeri italiani scritti. <span class=\"badge stop\">Scade il 04/10/2026</span>",
 'mktpay|c2':"Piano Francia 02/09/2026: 50% del margine aggiuntivo, quota base 0,10% + 0,02 €/transazione, via Planet Monetic. <b>Struttura diversa dall'offerta italiana</b>, che usa invece il rebate fisso per circuito.",

 'nexi|r1':'Acquirer e issuer, gruppo Nexi','nexi|r2':'Italia','nexi|r3':'Banca d\'Italia — Albo IMEL art. 114-quater, n. 32875.7','nexi|r4':'Operatore domestico principale',
 'nexi|r5':'Due contratti distinti. <b>Accordo di Collaborazione Commerciale</b> firmato 21/11/2025, 3 anni con rinnovo tacito annuale, recesso di una delle parti con 60 giorni di preavviso. <b>App Approval Policy</b> firmata 10/09/2026, efficace dal 01/01/2027 per 12 mesi, rinnovo automatico, disdetta con 90 giorni.','nexi|r6':'Accordo di Collaborazione Commerciale firmato 21/11/2025, Allegato A. Una tantum attivazione: SmartPOS 120 €, SmartPOS Mini con stampante 90 €, SoftPOS 20 €, tutti netti IVA. Management fee annuale per cluster di transazioni per dispositivo: XS 20 · S 60 · M 120 · L 240 · XL 450 €. Pagata in un\'unica soluzione entro il 15.02 dell\'anno successivo, <b>per un massimo di 3 anni solari dall\'attivazione</b>. Contano solo i POS con almeno una transazione nel periodo. Licenza OnSet 395 €/anno/cliente e manutenzione 95 o 195 € sono nostro listino, non Nexi.',
 'nexi|r7':'Il passaggio da bundle a % fee sul transato è un\'ipotesi della direzione: <b>non compare in nessuno dei contratti firmati</b>. Soglia e percentuale tutte da negoziare. Attenzione al limite dei 3 anni solari sulla management fee: al quarto anno un cliente attivato oggi vale zero. '+NV,'nexi|r8':'Nessuno sconto previsto dall\'Allegato A: i corrispettivi sono fissi per cluster. Un ribasso andrebbe negoziato come modifica scritta ex art. 11.1. '+NV,
 'nexi|r9':'Collaborazione commerciale: 3 anni dal 21/11/2025, rinnovo tacito annuale, recesso libero con 60 giorni da entrambe le parti. App Approval Policy: 12 mesi dal 01/01/2027, disdetta con 90 giorni. Alla cessazione Nexi paga solo i corrispettivi maturati, nulla per i periodi successivi.',
 'nexi|r10':'L\'app Lp.Pay è gratuita per l\'esercente, 0 €/mese, nessun in-app purchase: Nexi non prende nulla sulle nostre sottoscrizioni e noi non incassiamo nulla dallo store. Le fee le incassiamo sulla Lotus Pecas Platform, fuori dal SmartPOS. L\'app non deve competere con Nexi o con app preinstallate, vietati banner pubblicitari e monetizzazione del secondo schermo, vietato guidare traffico referral. Assistenza in italiano o inglese in orario lavorativo, obbligatoria: un SLA scadente è motivo di rimozione.',
 'dojo|r9':'3 anni dal 25/05/2026. Paymentsense può risolvere con 90 giorni, o subito se cambia proprietà/management o se in un trimestre non portiamo nuovi merchant. Coda compensi 12 mesi.',

 'nexi|f6':'Canone mensile con contratto acquiring Nexi','nexi|f7':'Rivenditori + pubblicazione ISV su store SmartPOS',
 'nexi|f8':'<b>Risposta trovata nei documenti: no.</b> App Approval Policy §10: i Developer DEVONO riferirsi al dispositivo come "Nexi SmartPOS". L\'app Lp.Pay è pubblicata col nostro marchio sullo store, ma il terminale resta Nexi. Nessun white label del device.',
 'nexi|f9':'SDK Android SmartPOS + catalogue API + content provider. Ogni apk passa dal Developer Portal e dalla review Nexi, anche gli aggiornamenti. Vietato scaricare codice aggiuntivo dopo la certificazione, vietato root, vietata licenza o chiave all\'avvio. Demo e beta non distribuibili sullo store. Conto visione test firmato 03/12/2025, 11 mesi.',
 'nexi|f10':'Il contratto acquiring si firma direttamente tra Nexi e l\'esercente: <b>noi non possiamo promuovere né collocare servizi di pagamento</b> (art. 5.2, attività riservata ex D.Lgs. 385/1993). Il nostro unico strumento è il <b>voucher</b>: se il cliente non lo inserisce, Nexi non ci riconosce nulla (Allegato A §3.1). Rendicontazione semestrale. Se l\'esercente recede dall\'acquiring, i nostri compensi si fermano subito. Foro di Milano. Materiale in conto visione da restituire, penale fino a 500 €/terminale.',

 'adyen|r5':'Nessun contatto avviato. Programma partner aperto a POS integrator e software house tramite modulo partner.','adyen|r6':'<b>Margine sul costo:</b> compriamo a Interchange++ più la quota Adyen e rivendiamo al nostro listino. Il margine è la differenza, interamente nostra. In più, <b>Adyen Capital</b>: finanziamento agli esercenti sulla base del loro transato, con il 20% della commissione fissa Adyen riconosciuto a noi come quota di ricavo.',

 'adyen|f1':'Gamma propria di terminali certificati PCI PTS 6, per retail, hospitality, eventi, delivery','adyen|f2':'Sì. Costo aggiuntivo 0,07 € per transazione (piano Francia). <b>Attenzione al margine:</b> su un pagamento consumer da 20 € il SoftPOS costa 0,23 € contro 0,16 € del terminale fisico, cioè 1,15% effettivo contro 0,80%. Rivendendo a 0,99% il terminale fisico rende 0,038 €, il SoftPOS perde 0,032 €. Disponibilità italiana <span class="badge warn">Da confermare</span>','adyen|f3':'Gamma propria basata su hardware Castles e affini, certificata PCI PTS 6. <span class="badge warn">Da confermare</span>',
 'adyen|f4':'<b>Condizioni ottenute dal piano Francia (02/09/2026), non valide per l\'Italia.</b> Interchange++ più quota Adyen per fascia di volume carta mensile: 0,32% sotto 4 M€ · 0,27% da 4 a 8 M€ · 0,24% da 8 a 16 M€ · 0,19% da 16 a 32 M€ · 0,17% oltre 32 M€. Sconti a scaglioni. Fee per transazione: 0,04 € sulle prime 250.000/mese, 0,035 € sulle successive 250.000, 0,025 € oltre 500.000. Tap to Pay +0,07 €/transazione. KYC 10 €/cliente. Trasferimento tra conti 0,20 €. Bonifico J+2 0,25 €, J+1 0,03% + 0,25 €. Uplift e 3DS 0,02 €/transazione. PagoBANCOMAT non quotato: per l\'Italia è la prima cosa da chiedere. Per l\'Italia: Interchange++ dichiarato dalla stessa Adyen: interchange + scheme fee + markup acquirer. <b>0,11 € fissi per transazione in Europa</b> più markup a partire da 0,60% sul transato, decrescente al crescere del volume mensile (fonte: help.adyen.com e analisi di mercato 2026). Costo medio totale su carte consumer europee intorno all\'1%. Chargeback intorno a 25 € per disputa. <span class="badge warn">Da confermare</span>','adyen|f5':'Nessun canone mensile nelle condizioni Francia. L\'impegno è sul volume, non su una fattura minima. Terminali al netto delle tasse: NYC1 59 € · AMS1 199 € · V210 275 € · S1F2 395 €. Per l\'Italia tutto <span class="badge warn">Da confermare</span>','adyen|f6':'Terminali in acquisto o noleggio dal listino Adyen, prezzi non pubblici per l\'Italia. <span class="badge warn">Da confermare</span>',
 'adyen|f7':'Programma partner con portale dedicato, partner manager, badge di qualità, accesso anticipato ai pilot. Canale esplicito per POS integrator e system integrator.',
 'adyen|f8':'Adyen for Platforms consente di gestire sub-merchant sotto la nostra piattaforma, che è la forma di white label più vicina alle nostre esigenze. Comporta però raccolta del SAQ A e responsabilità di onboarding in capo a noi. <span class="badge warn">Da confermare</span>','adyen|f9':'Terminal API in JSON, locale o cloud, senza middleware. Terminali gestiti centralmente con aggiornamenti automatici. Documentazione pubblica completa.',
 'adyen|f10':'Nessuna iscrizione self-service: si passa da un processo commerciale che secondo le analisi di mercato richiede settimane. Storicamente orientati a mid-market ed enterprise, con soglie di volume oggi attenuate ma non azzerate. Per noi la domanda vera è se rientriamo nei criteri. <span class="badge warn">Da confermare</span>',

async function push(){if(!sbOn()||!TOK)return;
 try{const r=await fetch(api('/rest/v1/lppay_state'),{method:'POST',
   headers:{...hdr(1),Prefer:'resolution=merge-duplicates'},
   body:JSON.stringify([{id:'main',data:S,updated_at:new Date().toISOString()}])});
  if(!r.ok){const txt=await r.text();
   if(r.status===401||r.status===403){TOK='';localStorage.removeItem('sb_tok');SYNC={state:'ro',msg:''};
    toast(t('Sessione scaduta: rifai il login dalle Impostazioni','Oturum doldu: Ayarlar’dan tekrar giriş yap'))}
   else{SYNC={state:'err',msg:txt.slice(0,160)}}syncBadge();return}
  SYNC={state:'rw',msg:''};syncBadge()}
 catch(e){SYNC={state:'err',msg:String(e).slice(0,160)};syncBadge()}}

async function pull(silent){if(!sbOn()){if(!silent)toast(t('Supabase non configurato','Supabase yapılandırılmadı'));return}
 try{const r=await fetch(api('/rest/v1/lppay_state?id=eq.main&select=data,updated_at'),{headers:hdr(1)});
  if(!r.ok){SYNC={state:'err',msg:'HTTP '+r.status};syncBadge();if(!silent)toast('HTTP '+r.status);return}
  const j=await r.json();
  if(j[0]&&j[0].data){S=j[0].data;load();localStorage.setItem(LS,JSON.stringify(S));
   SYNC={state:TOK?'rw':'ro',msg:''};all();if(!silent)toast(t('Dati scaricati','Veriler indirildi'))}
  else{SYNC={state:TOK?'rw':'ro',msg:''};syncBadge();if(!silent)toast(t('Nessun dato remoto: salva per crearlo','Uzak veri yok'))}}
 catch(e){SYNC={state:'err',msg:String(e).slice(0,160)};syncBadge();if(!silent)toast(t('Errore di rete','Ağ hatası'))}}

  const j=await r.json();

   SYNC={state:'rw',msg:''};all();toast(t('Accesso editor riuscito','Editör girişi başarılı'));return true}
  toast(j.error_description||j.msg||t('Credenziali non valide','Geçersiz bilgiler'));return false}
 catch(e){toast(t('Errore di rete','Ağ hatası'));return false}}

let SELR=null,SELC=null,VIS=null,COLL={};
const EN=()=>L==='en';
const CM_=()=>EN()?S.compare.cellsEn:S.compare.cells;
const cellVal=k=>EN()?(S.compare.cellsEn[k]??''):(S.compare.cells[k]??'');
const cellMissing=k=>{const it=(S.compare.cells[k]||'').trim(),en=(S.compare.cellsEn[k]||'').trim();
 return it&&!en?'en':(en&&!it?'it':'')};
const lbl=o=>EN()?(o.labelEn||o.label):(o.label||o.labelEn||'');
const cname=c=>EN()?(c.nameEn||c.name):(c.name||c.nameEn||'');
const bi=(o,f)=>EN()?(o[f+'Tr']||o[f]||''):(o[f]||o[f+'Tr']||'');
function missingCount(){let n=0;S.compare.cols.forEach(c=>S.compare.rows.forEach(r=>{if(!r.sect&&cellMissing(c.id+'|'+r.id))n++}));
 S.compare.rows.forEach(r=>{if(!(r.labelEn||'').trim()&&(r.label||'').trim())n++});
 S.compare.cols.forEach(c=>{if(!(c.nameEn||'').trim()&&(c.name||'').trim())n++});return n}
const blockLen=(R,i)=>{let j=i+1;while(j<R.length&&!R[j].sect)j++;return j-i};
function compare(){
 $('#p-compare').innerHTML=`<h1>${t('Comparatore','Karşılaştırma')}</h1>

 $('#acol').onclick=()=>{const id=uid(),c=nextColor(),nm=t('Nuovo operatore','Yeni operatör');

function grid(){
 const D={...S.compare,cols:S.compare.cols.filter(c=>VIS.has(c.id))},el=$('#tc');

   <span class="pick" data-selc="${c.id}">●</span>
   ${s?`<button class="btn xs dg" data-act="col:compare|${c.id}" style="margin-left:6px">${t('Elimina colonna','Sütunu sil')}</button>`:''}</th>`}).join('')+'</tr></thead><tbody>';
 D.rows.forEach((r,i)=>{const s=SELR===r.id;
  if(r.sect){const op=!COLL[r.id],n=blockLen(D.rows,D.rows.findIndex(x=>x.id===r.id))-1;
   h+=`<tr class="sect${s?' sel':''}" draggable="true" data-rid="${r.id}" data-sect="1">
   <th colspan="${D.cols.length+1}"><span class="hd">⠿</span>
   <button class="chev" data-coll="${r.id}" aria-expanded="${op}" title="${op?'Chiudi':'Apri'}">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${op?90:0}deg);transition:transform .2s"><path d="M9 6l6 6-6 6"/></svg></button>
   <span contenteditable data-row="${r.id}">${esc(lbl(r))}</span>
   <span class="badge" style="margin-left:8px;font-size:.68rem">${n}</span>${(EN()?!(r.label||'').trim():!(r.labelEn||'').trim())?`<span class="tx" data-tx="row|${r.id}">${EN()?'IT':'TR'}</span>`:''}
   <span class="pick" data-selr="${r.id}">●</span>
   ${s?`<button class="btn xs dg" data-act="row:compare|${r.id}" style="margin-left:6px">${t('Elimina sezione e righe','Bölümü ve satırları sil')}</button>`:''}</th></tr>`;return}
  let own=null;for(let q=D.rows.indexOf(r);q>=0;q--){if(D.rows[q].sect){own=D.rows[q].id;break}}
  if(own&&COLL[own])return;
  h+=`<tr draggable="true" data-rid="${r.id}" class="${s?'sel':''}"><th><span class="hd">⠿</span> <span contenteditable data-row="${r.id}">${esc(lbl(r))}</span>${(EN()?!(r.label||'').trim():!(r.labelEn||'').trim())?`<span class="tx" data-tx="row|${r.id}">${EN()?'IT':'TR'}</span>`:''}
   <span class="pick" data-selr="${r.id}">●</span>${s?`<button class="btn xs dg" data-act="row:compare|${r.id}" style="margin-left:6px">${t('Elimina','Sil')}</button>`:''}</th>`+
   D.cols.map(c=>`<td contenteditable data-cell="${c.id}|${r.id}" data-anchor="${esc(c.name)} · ${esc(r.label)}" style="color:color-mix(in srgb,${c.color||'var(--ink)'} 42%,var(--ink));box-shadow:inset 3px 0 0 color-mix(in srgb,${c.color||'var(--line)'} 22%,transparent)">${cellVal(c.id+'|'+r.id)}</td>${''}`).join('')
   .replace(/<\/td>/g,'</td>')+'</tr>'});
 el.innerHTML=h+'</tbody>';
 el.querySelectorAll('[data-cell]').forEach(td=>{const k=td.dataset.cell;const m=cellMissing(k);

  if((EN()&&!(S.compare.cellsEn[k]||'').trim()&&(S.compare.cells[k]||'').trim())||(!EN()&&!(S.compare.cellsEn[k]||'').trim()&&(S.compare.cells[k]||'').trim())){

function gridDrag(el){
 const R=()=>S.compare.rows;let src=null;
 el.querySelectorAll('tr[draggable]').forEach(tr=>{
  tr.addEventListener('dragstart',e=>{src=tr;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','x')});
  tr.addEventListener('dragover',e=>{e.preventDefault();
   const ok=src&&(src.dataset.sect?tr.dataset.sect==='1':true);tr.classList.toggle('dov',!!ok)});
  tr.addEventListener('dragleave',()=>tr.classList.remove('dov'));
  tr.addEventListener('drop',e=>{e.preventDefault();tr.classList.remove('dov');if(!src||src===tr)return;
   const rows=R(),a=rows.findIndex(x=>x.id===src.dataset.rid);
   if(src.dataset.sect){
    /* un blocco si muove solo davanti a un altro blocco */
    if(tr.dataset.sect!=='1'){toast(t('Una macrocategoria si sposta solo su un\'altra macrocategoria','Ana başlık yalnızca başka bir ana başlığın üzerine bırakılabilir'));return}
    const len=blockLen(rows,a),cut=rows.splice(a,len);
    const tgt=rows.findIndex(x=>x.id===tr.dataset.rid);
    rows.splice(tgt<0?rows.length:tgt,0,...cut);
   }else{
    if(tr.dataset.sect==='1'){toast(t('Rilascia la riga su un\'altra riga, non sull\'intestazione','Satırı başka bir satırın üzerine bırak'));return}
    const[m]=rows.splice(a,1);rows.splice(rows.findIndex(x=>x.id===tr.dataset.rid),0,m)}
   save(1);grid()})});
 el.querySelectorAll('[data-dcol]').forEach(hd=>{const th=hd.closest('th');
  hd.addEventListener('dragstart',e=>e.dataTransfer.setData('col',hd.dataset.dcol));
  th.addEventListener('dragover',e=>e.preventDefault());
  th.addEventListener('drop',e=>{e.preventDefault();const s=e.dataTransfer.getData('col');if(!s)return;
   const C=S.compare.cols,a=C.findIndex(x=>x.id===s),b=C.findIndex(x=>x.id===hd.dataset.dcol);

  const fee=cl?cl.fee:(a.clusters.length?[...a.clusters].sort((x,y)=>y.min-x.min)[0].fee:0);rec=p.c*fee*((1-big)+big*eff)}

  ?`Con questi numeri vince <b style="color:${w.a.color}">${esc(w.a.name)}</b> a ${eur(w.tot)}/anno contro ${eur(l.tot)} di ${esc(l.a.name)}. Sul solo ricavo ricorrente, quello che resta quando le installazioni si fermano, il primo è <b style="color:${rc.a.color}">${esc(rc.a.name)}</b> con ${eur(rc.rec)}. È il numero da guardare oltre il primo anno.`
  :`<b style="color:${w.a.color}">${esc(w.a.name)}</b> wins at ${eur(w.tot)}/yr against ${eur(l.tot)}. On recurring revenue alone <b style="color:${rc.a.color}">${esc(rc.a.name)}</b> leads with ${eur(rc.rec)}.`;
 const cb=$('#calcbox');
 if(cb){cb.innerHTML=res.map(r=>calcSteps(r,vol)).join('');cb.classList.toggle('hidden',!CALC)}
}
function calcSteps(r,vol){const a=r.a,big=SP.b/100,eff=1-SP.d/100,adj=(1-big)+big*eff;
 const fee=n=>eur(n);let body='';
 if(a.model==='bundle'){const cl=a.clusters.find(x=>SP.tx>=x.min&&x.max>=SP.tx);
  body=`<span class="op">${t('fascia per','şu işlem adedi için dilim:')} ${SP.tx.toLocaleString('it-IT')} tx/${t('anno','yıl')} →</span> ${cl?esc(cl.k)+' = '+fee(cl.fee)+'/'+t('cliente','müşteri'):t('fuori scala, usata la fascia più alta','ölçek dışı, en yüksek dilim kullanıldı')}
   <br><span class="op">${t('ricorrente','tekrarlayan')} =</span> ${SP.c} ${t('clienti','müşteri')} <span class="op">×</span> ${fee(cl?cl.fee:0)} <span class="op">×</span> ${adj.toFixed(3)} <span class="op">(${t('sconto','indirim')})</span> <span class="op">=</span> <span class="res">${fee(r.rec)}</span>`}
 if(a.model==='pct'){const m=vol*Math.max(0,a.mdr-a.cost)/100;
  body=`<span class="op">${t('margine acquirer','acquirer marjı')} =</span> ${eur(vol)} <span class="op">×</span> (${a.mdr}% − ${a.cost}%) <span class="op">=</span> ${fee(m)}
   <br><span class="op">${t('nostra quota','bizim payımız')} =</span> ${fee(m)} <span class="op">×</span> ${a.share}% <span class="op">×</span> ${adj.toFixed(3)} <span class="op">=</span> <span class="res">${fee(r.rec)}</span>`}
 if(a.model==='circ'){let q=0;const det=S.circ.rows.filter(r=>(S.circ.mix[r.id]||0)>0&&(S.circ.cells[a.id+'|'+r.id]||{}).p)
   .map(r=>{const v=S.circ.cells[a.id+'|'+r.id],w=(S.circ.mix[r.id]||0)/100;q+=w*v.p;
    return `<br><span class="op">${esc(bi(r,'label')).slice(0,34)} —</span> ${S.circ.mix[r.id]}% <span class="op">×</span> ${v.p}% <span class="op">=</span> ${(w*v.p).toFixed(4)}%`}).join('');
  body=`<span class="op">${t('quota ponderata per circuito','şema bazında ağırlıklı pay')}:</span>${det}
   <br><span class="op">${t('totale','toplam')} =</span> <b>${q.toFixed(4)}%</b> <span class="op">×</span> ${eur(vol)} <span class="op">=</span> <span class="res">${fee(r.rec)}</span>`}
 if(a.model==='flat')body=`<span class="op">${t('nessun ricorrente: solo premio per attivazione','tekrarlayan gelir yok: yalnızca aktivasyon primi')}</span> <span class="op">=</span> <span class="res">${fee(0)}</span>`;
 if(a.model==='custom'){const m=vol*Math.max(0,a.mdr-a.cost)/100;
  body=`<span class="op">${t('fisso','sabit')} =</span> ${SP.c} <span class="op">×</span> ${fee(a.recfix||0)} <span class="op">=</span> ${fee(SP.c*(a.recfix||0))}
   <br><span class="op">${t('per transazione','işlem başına')} =</span> ${(SP.c*SP.tx).toLocaleString('it-IT')} tx <span class="op">×</span> ${(a.pertx||0)} € <span class="op">=</span> ${fee(SP.c*SP.tx*(a.pertx||0))}
   <br><span class="op">${t('quota margine','marj payı')} =</span> ${fee(m)} <span class="op">×</span> ${a.share||0}% <span class="op">=</span> ${fee(m*(a.share||0)/100)}
   <br><span class="op">${t('ricorrente','tekrarlayan')} =</span> <span class="res">${fee(r.rec)}</span>`}
 return `<div class="calc" style="border-left:3px solid ${a.color}">
  <b style="color:${a.color};font-family:Inter,sans-serif">${esc(a.name)}</b>
  <span class="badge" style="margin-left:8px;font-family:Inter,sans-serif">${modelName(a)}</span><hr>
  ${body}<hr>
  <span class="op">${t('attivazioni','aktivasyonlar')} =</span> ${SP.n} <span class="op">×</span> ${fee(a.inst)} <span class="op">=</span> ${fee(r.one)}
  <hr><span class="op">${t('totale anno','yıl toplamı')} =</span> <span class="res" style="color:${a.color}">${fee(r.tot)}</span></div>`}

   if(v.m||v.p){cov+=w*100}m+=w*(v.m||0);pp+=w*(v.p||0)});

   <div class="kv"><span>${t('Quota media ponderata a noi','Bize ağırlıklı ortalama pay')}</span><b style="color:${e.c.color}">${e.p?e.p.toFixed(3)+'%':'—'}</b></div>

 const M={tab:[t('Tariffe per circuito','Şema bazında tarifeler'),tbl,'M2 9h20M4 6h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z','var(--amber)'],
  sum:[t('Media ponderata sul mix','Dağılıma göre ağırlıklı ortalama'),sum,'M4 19V9M10 19V5M16 19v-7M22 19H2','var(--jade)']};
 S.layout.circ=S.layout.circ||['tab','sum'];
 $('#p-circ').innerHTML=`<h1>${t('Circuiti','Şemalar')}</h1>
  <p class="lead">${t('La commissione non è un numero solo: cambia per ogni circuito. Qui vedi quanto paga l\'esercente e quanto resta a noi, circuito per circuito. Il mix a sinistra è la distribuzione stimata del transato italiano: cambialo e la media ponderata si aggiorna.','Komisyon tek bir sayı değil: her şema için değişir. Burada üye iş yerinin ne ödediğini ve bize ne kaldığını şema şema görürsün.')}</p>`+
  S.layout.circ.map(k=>modWrap('circ',k,M[k][0],M[k][1],M[k][2],M[k][3])).join('');
 const P=$('#p-circ');
 P.querySelectorAll('[data-mix]').forEach(i=>i.addEventListener('change',()=>{S.circ.mix[i.dataset.mix]=+i.value||0;save(1);circ()}));
 P.querySelectorAll('[data-cc]').forEach(i=>i.addEventListener('change',()=>{const[cid,rid,f]=i.dataset.cc.split('|');
  const k=cid+'|'+rid;S.circ.cells[k]=S.circ.cells[k]||{};S.circ.cells[k][f]=+i.value||0;save(1);circ()}));

   <details style="margin-top:14px"><summary class="sm dim" style="cursor:pointer">${t('Come si prepara il database, una volta sola','Veritabanı nasıl hazırlanır')}</summary>

  </div>
  <div class="card"><h3>${t('Accesso e brand','Erişim ve marka')}</h3>

   <p class="sm dim">${t('Protegge l\'apertura della pagina, non i dati. La vera protezione sulla scrittura è il login editor qui a fianco.','Sayfanın açılışını korur, verileri değil.')}</p>
   <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
   <div class="row"><label class="btn xs" style="cursor:pointer">Logo<input type="file" id="lf" accept="image/*" class="hidden"></label>
